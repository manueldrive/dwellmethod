<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MS Hang Prep — Mark 1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --paper:#FFFFFF;
    --cream:#EAE6DF;
    --lime:#C3F53C;
    --pink:#F43F5E;
    --blue:#38BDF8;
    --yellow:#FFC72C;
    --purple:#A855F7;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background:#000; font-family:'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior:none; }
  .phone{ position:relative; width:100%; max-width:430px; height:100vh; height:100dvh; margin:0 auto; background:var(--cream); overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,0.5); display:flex; flex-direction:column; transition:background-color .3s ease; }
  @media (min-width:431px){ body{ display:flex; align-items:center; justify-content:center; } .phone{ height:90vh; height:90dvh; border-radius:36px; border:4px solid #FFF; } }

  .line-art{ position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.12; background-image:radial-gradient(#000 2px, transparent 2px); background-size:24px 24px; }

  .hud-header{ position:relative; z-index:50; padding:14px 18px 6px 54px; display:flex; flex-direction:column; gap:7px; }
  .progress-row{ display:flex; gap:4px; }
  .seg{ flex:1; height:5px; border-radius:3px; background:rgba(13,13,13,0.15); overflow:hidden; position:relative; }
  .tx-light .seg{ background:rgba(255,255,255,0.28); }
  .seg .fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--ink); border-radius:3px; }
  .tx-light .seg .fill{ background:#FFF; }
  .seg.done .fill{ width:100%; }
  .seg.current .fill.static{ width:38%; }
  .seg.filling .fill{ animation-name:fillBar; animation-timing-function:linear; animation-fill-mode:forwards; }
  @keyframes fillBar{ from{width:0%;} to{width:100%;} }
  .story-meta{ display:flex; justify-content:space-between; font-family:'Space Grotesk', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:.8; }

  .back-ctrl{ position:absolute; top:14px; left:16px; z-index:60; width:32px; height:32px; border-radius:50%; background:#FFF; border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .2s ease; box-shadow:2px 2px 0 var(--ink); }
  .back-ctrl.show{ opacity:1; pointer-events:auto; }
  .back-ctrl svg{ width:13px; height:13px; }

  .stage{ position:relative; flex:1; overflow:hidden; z-index:1; perspective:1400px; }
  .beat{ position:absolute; inset:0; display:flex; flex-direction:column; padding:16px 20px 24px 20px; opacity:0; transform:translateY(10px) scale(0.98); transition:opacity .25s ease, transform .25s ease; pointer-events:none; z-index:1; }
  .beat.active{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; z-index:2; }
  .tx-dark{ color:var(--ink); }
  .tx-light{ color:#FFF; }

  .kicker{ font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; opacity:.8; margin-bottom:6px; position:relative; z-index:2; }
  .instr{ font-family:'Space Grotesk', sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; opacity:.65; margin-bottom:12px; position:relative; z-index:2; }
  .emoji{ font-size:42px; line-height:1; margin-bottom:6px; position:relative; z-index:2; }

  .hero-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2; }
  .kline{ overflow:hidden; }
  .kword{ display:inline-block; opacity:0; transform:translateY(16px) scale(0.92); font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-1.5px; text-transform:uppercase; }
  .beat.active .kword{ animation:kwIn .5s cubic-bezier(.2,.85,.25,1) forwards; }
  @keyframes kwIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  .hero-title .kword{ font-size:clamp(36px, 13vw, 56px); line-height:0.95; }
  .hero-title.tight .kword{ font-size:clamp(28px, 10vw, 42px); }

  .sub{ font-family:'Inter', sans-serif; font-size:16px; font-weight:800; line-height:1.4; opacity:.94; margin-top:14px; position:relative; z-index:2; }
  .stat-lines{ margin-top:16px; display:flex; flex-direction:column; gap:10px; position:relative; z-index:2; }
  .stat-line{ font-family:'Inter', sans-serif; font-size:15px; font-weight:800; line-height:1.35; background:rgba(255,255,255,0.9); color:var(--ink); border:3px solid var(--ink); border-radius:14px; padding:11px 13px; box-shadow:3px 3px 0 var(--ink); }
  .stat-line em{ font-style:normal; color:var(--pink); }

  .continue-btn{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; letter-spacing:.3px; text-transform:uppercase; background:var(--ink); color:#FFF; border:4px solid var(--ink); border-radius:100px; padding:15px 0; width:100%; margin-top:14px; cursor:pointer; opacity:.35; pointer-events:none; box-shadow:4px 4px 0 rgba(0,0,0,0.25); transition:all .18s ease; position:relative; z-index:5; flex-shrink:0; }
  .continue-btn.ready{ opacity:1; pointer-events:auto; box-shadow:5px 5px 0 var(--ink); }
  .continue-btn.ready:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--ink); }

  .tap-hint{ font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:.65; margin-top:auto; text-align:center; padding-top:14px; position:relative; z-index:2; }

  .crumb-row{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:16px; position:relative; z-index:2; }
  .crumb{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13px; background:rgba(255,255,255,0.85); color:var(--ink); border:2.5px solid var(--ink); padding:7px 12px; border-radius:20px; opacity:0; transform:translateY(8px); box-shadow:2px 2px 0 var(--ink); }
  .crumb.final{ background:var(--yellow); }
  .crumb-arrow{ opacity:0; font-weight:700; }
  .beat.active .crumb, .beat.active .crumb-arrow{ animation:crumbIn .4s ease forwards; }
  .beat.active .crumb:nth-child(1){ animation-delay:.15s; }
  .beat.active .crumb-arrow:nth-child(2){ animation-delay:.5s; }
  .beat.active .crumb:nth-child(3){ animation-delay:.7s; }
  .beat.active .crumb-arrow:nth-child(4){ animation-delay:1.05s; }
  .beat.active .crumb:nth-child(5){ animation-delay:1.25s; }
  @keyframes crumbIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .quiz-grid{ display:flex; flex-direction:column; gap:11px; margin-top:6px; position:relative; z-index:2; overflow-y:auto; padding:2px 8px 8px 2px; }
  .quiz-tile{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16.5px; background:#FFF; color:var(--ink); border:3.5px solid var(--ink); border-radius:16px; padding:13px 15px; cursor:pointer; transition:all .13s ease; box-shadow:4px 4px 0 var(--ink); }
  .quiz-tile:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
  .quiz-tile .qt-desc{ display:block; font-family:'Inter',sans-serif; font-size:11.5px; font-weight:700; opacity:.7; margin-top:3px; text-transform:none; letter-spacing:0; }
  .qt-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .qt-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16.5px; }
  .qt-badge-inline{ font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:700; background:var(--ink); color:#FFF; padding:3px 9px; border-radius:100px; white-space:nowrap; flex-shrink:0; }
  .quiz-tile.correct .qt-badge-inline, .quiz-tile.incorrect .qt-badge-inline{ background:rgba(0,0,0,0.25); }
  .quiz-tile .qt-badge{ display:inline-block; font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:700; background:var(--ink); color:#FFF; padding:3px 9px; border-radius:100px; margin-top:6px; letter-spacing:.3px; }
  .quiz-tile.selected{ background:var(--lime); }
  .quiz-tile.correct{ background:var(--lime) !important; color:var(--ink) !important; box-shadow:0 0 0 4px rgba(195,245,60,0.5), 4px 4px 0 var(--ink) !important; }
  .quiz-tile.incorrect{ background:var(--pink) !important; color:#FFF !important; }
  .quiz-tile.locked{ pointer-events:none; }
  @keyframes shakeX{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
  .quiz-tile.shake{ animation:shakeX .45s; }

  .feedback-box{ font-family:'Inter', sans-serif; font-size:13px; font-weight:800; margin-top:10px; padding:11px 13px; border-radius:14px; opacity:0; transition:opacity .15s ease; position:relative; z-index:2; flex-shrink:0; background:#FFF; color:var(--ink); border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); }
  .feedback-box.show{ opacity:1; }
  .feedback-box.good{ background:var(--lime); }
  .feedback-box.bad{ background:var(--pink); color:#FFF; }

  .big-number{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(56px,20vw,92px); color:var(--lime); line-height:.85; letter-spacing:-3px; margin:10px 0 4px 0; position:relative; z-index:2; }
  .years-ago{ font-family:'Inter', sans-serif; font-size:16px; font-weight:800; opacity:.95; position:relative; z-index:2; }
  .years-ago span{ color:var(--lime); }

  .passage-ref{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:12.5px; letter-spacing:1px; text-transform:uppercase; margin-bottom:0; position:relative; z-index:2; }
  .passage-card{ border:3.5px solid var(--ink); border-radius:20px; box-shadow:4px 4px 0 var(--ink); background:#FFF; overflow:hidden; display:flex; flex-direction:column; flex:1; position:relative; z-index:2; }
  .passage-banner{ background:var(--yellow); color:var(--ink); border-bottom:3.5px solid var(--ink); padding:9px 13px; font-family:'Space Grotesk',sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; text-align:center; flex-shrink:0; }
  .passage-scroll{ overflow-y:auto; flex:1; padding:15px; color:var(--ink); }
  .verse-line{ margin-bottom:10px; font-size:15.5px; line-height:1.6; font-family:'Inter',sans-serif; font-weight:700; }
  .verse-num{ font-family:'Space Grotesk', sans-serif; font-weight:700; color:var(--purple); margin-right:4px; font-style:normal; font-size:11.5px; vertical-align:top; }
  .w{ cursor:pointer; border-bottom:2px dotted rgba(13,13,13,0.35); padding:0 1px; border-radius:3px; }
  .w.flagged{ background:var(--yellow); border-bottom-color:transparent; font-weight:900; }
  .tap-count{ font-family:'Space Grotesk', sans-serif; font-size:11.5px; font-weight:700; opacity:.7; margin-top:8px; position:relative; z-index:2; flex-shrink:0; }

  .review-card{ background:#FFF; border:3px solid var(--ink); border-radius:14px; padding:12px 14px; margin-bottom:10px; font-family:'Inter', sans-serif; font-size:13.5px; font-weight:700; line-height:1.4; box-shadow:3px 3px 0 var(--ink); color:var(--ink); position:relative; z-index:2; }
  .review-card b{ color:var(--purple); text-transform:capitalize; }
  .review-scroll{ flex:1; overflow-y:auto; position:relative; z-index:2; padding:2px 8px 8px 2px; }
  .pill-cloud{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .research-pill{ font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:700; background:var(--ink); color:#FFF; padding:7px 13px; border-radius:100px; text-transform:capitalize; }
  .pill-cloud-label{ font-family:'Space Grotesk', sans-serif; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; opacity:.7; margin:10px 0 2px 0; }

  .verse-pick-list{ overflow-y:auto; flex:1; margin-top:6px; position:relative; z-index:2; background:#FFF; border:3.5px solid var(--ink); border-radius:18px; box-shadow:4px 4px 0 var(--ink); padding:4px 6px; }
  .verse-tile{ display:flex; gap:9px; align-items:flex-start; padding:11px 8px; cursor:pointer; transition:background .13s ease; color:var(--ink); border-bottom:2px solid rgba(13,13,13,0.12); border-radius:10px; }
  .verse-tile:last-child{ border-bottom:none; }
  .verse-tile:active{ background:rgba(13,13,13,0.06); }
  .verse-tile .vnum{ font-family:'Space Grotesk', sans-serif; font-weight:700; color:var(--purple); flex-shrink:0; width:16px; }
  .verse-tile .vtext{ font-size:13.5px; line-height:1.4; font-family:'Inter',sans-serif; font-weight:700; }
  .verse-tile.selected{ background:var(--lime); }

  .verse-reveal-card{ background:#FFF; color:var(--ink); border:3.5px solid var(--ink); border-radius:18px; padding:16px 16px; margin-top:2px; position:relative; z-index:2; box-shadow:4px 4px 0 var(--ink); flex-shrink:0; }
  .verse-reveal-card .ref{ font-family:'Space Grotesk', sans-serif; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--purple); margin-bottom:6px; }
  .verse-reveal-card .vt{ font-style:normal; font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; line-height:1.45; }

  .book-page{ background:#FFF; color:var(--ink); border:4px solid var(--ink); border-radius:20px; padding:18px; margin-top:14px; box-shadow:5px 5px 0 var(--ink); position:relative; z-index:2; flex-shrink:0; }
  .book-page .bp-kicker{ font-family:'Space Grotesk', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:#888; margin-bottom:8px; }
  .book-page .bp-badge{ display:inline-block; font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:700; background:var(--lime); color:var(--ink); border:2.5px solid var(--ink); padding:7px 14px; border-radius:100px; margin-bottom:10px; }
  .book-page .bp-text{ font-family:'Inter', sans-serif; font-size:14.5px; font-weight:700; line-height:1.45; }

  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; position:relative; z-index:2; flex-shrink:0; }
  .chip{ font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:700; background:#FFF; color:var(--ink); border:2.5px solid var(--ink); padding:8px 13px; border-radius:100px; cursor:pointer; transition:all .13s ease; box-shadow:3px 3px 0 var(--ink); }
  .chip:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
  .chip.selected{ background:var(--ink); color:#FFF; }
  .char-input{ width:100%; padding:11px 13px; margin-top:2px; border:3px solid var(--ink); border-radius:14px; font-family:'Inter', sans-serif; font-size:13.5px; font-weight:700; outline:none; background:#FFF; display:none; flex-shrink:0; position:relative; z-index:2; color:var(--ink); }
  .coach-box{ background:#FFF; border:3px solid var(--ink); border-radius:16px; padding:13px 14px; margin-top:12px; position:relative; z-index:2; flex-shrink:0; box-shadow:3px 3px 0 var(--ink); color:var(--ink); display:none; }
  .coach-box.show{ display:block; }
  .coach-box .cb-label{ font-family:'Space Grotesk', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:.6; margin-bottom:4px; }
  .coach-box .cb-text{ font-family:'Inter', sans-serif; font-size:13.5px; font-weight:700; line-height:1.4; }
  .coach-box .cb-text b{ color:var(--pink); }

  .breath-circle{ width:110px; height:110px; border-radius:50%; margin:18px auto; background:var(--purple); border:4px solid var(--ink); animation:breathe 5s ease-in-out infinite; position:relative; z-index:2; flex-shrink:0; }
  @keyframes breathe{ 0%,100%{ transform:scale(0.85); background:var(--purple); } 50%{ transform:scale(1.15); background:var(--lime); } }
  .breath-text{ font-family:'Inter', sans-serif; font-size:16.5px; font-weight:800; line-height:1.45; text-align:center; position:relative; z-index:2; }

  .final-card{ background:#FFF; color:var(--ink); border:4px solid var(--ink); border-radius:22px; padding:18px; position:relative; z-index:2; overflow-y:auto; flex:1; box-shadow:5px 5px 0 var(--ink); display:flex; flex-direction:column; }
  .final-card .fhdr{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .final-card .fhdr .fbadge{ font-family:'Space Grotesk',sans-serif; font-size:9px; font-weight:700; background:var(--lime); border:2px solid var(--ink); padding:4px 10px; border-radius:100px; }
  .final-card .flabel{ font-family:'Space Grotesk', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase; color:#666; margin-bottom:5px; margin-top:13px; }
  .final-card .flabel:first-child{ margin-top:0; }
  .word-chip-list{ display:flex; flex-direction:column; gap:6px; }
  .word-chip{ font-family:'Inter', sans-serif; font-size:12.5px; font-weight:700; line-height:1.4; }
  .word-chip b{ text-transform:capitalize; color:var(--purple); }
  .challenge-box{ background:var(--yellow); border:3px solid var(--ink); border-radius:14px; padding:11px 13px; margin-top:6px; box-shadow:3px 3px 0 var(--ink); font-weight:700; }
  .export-btn{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; letter-spacing:.3px; text-transform:uppercase; background:var(--lime); color:var(--ink); border:4px solid var(--ink); border-radius:100px; padding:15px 0; width:100%; margin-top:16px; cursor:pointer; position:relative; z-index:2; flex-shrink:0; box-shadow:5px 5px 0 var(--ink); transition:all .15s ease; }
  .export-btn:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--ink); }

  /* ---------- page-flip transition (reading-intro -> vocab-scan) ---------- */
  .beat.page-flip-out{
    animation: pageFlipOut .6s cubic-bezier(.45,.05,.55,.95) forwards;
    transform-origin: left center;
    backface-visibility: hidden;
    z-index:5 !important;
  }
  @keyframes pageFlipOut{
    0%{ transform:rotateY(0deg); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:rotateY(-100deg); opacity:0; }
  }

  /* ---------- book cover visual ---------- */
  .book-cover{ flex:1; display:flex; margin:0; border-radius:20px; overflow:hidden; box-shadow:6px 6px 0 var(--ink); border:4px solid var(--ink); background:linear-gradient(160deg, #1d5a8a, #0f2f47); position:relative; min-height:0; }
  .book-spine{ width:16px; background:rgba(0,0,0,0.35); flex-shrink:0; border-right:2px solid rgba(0,0,0,0.25); }
  .book-cover-inner{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:#FFF; text-align:center; padding:20px; }
  .book-emblem{ font-size:38px; opacity:.92; margin-bottom:2px; }
  .book-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; line-height:1.05; letter-spacing:1px; text-transform:uppercase; }
  .book-subtitle{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; letter-spacing:5px; opacity:.85; text-transform:uppercase; }
  .book-ribbon{ position:absolute; top:16px; left:50%; transform:translateX(-50%); background:var(--yellow); color:var(--ink); font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11px; padding:6px 14px; border-radius:100px; border:2.5px solid var(--ink); white-space:nowrap; box-shadow:2px 2px 0 var(--ink); z-index:2; }

  /* ---------- dev notes tool ---------- */
  .dev-toggle-btn{
    position:fixed; bottom:18px; right:18px; z-index:9999;
    width:52px; height:52px; border-radius:50%;
    background:var(--ink); color:#FFF; border:3px solid #FFF;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .dev-toggle-btn.open{ background:var(--pink); }
  .dev-drawer{
    position:fixed; right:16px; bottom:86px; z-index:9998;
    width:340px; max-width:82vw;
    max-height:64vh;
    background:#FFF; border:4px solid var(--ink); border-radius:20px;
    overflow-y:auto;
    padding:18px;
    transform:translateX(130%);
    transition:transform .25s ease;
    box-shadow:6px 6px 0 var(--ink), 0 12px 30px rgba(0,0,0,0.3);
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .dev-drawer.open{ transform:translateX(0); }
  .dev-drawer.hide-for-inspect{ transform:translateX(130%) !important; }
  .dev-inspect-badge{
    position:fixed; left:50%; top:18px; transform:translateX(-50%);
    z-index:9999; display:none;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px;
    background:var(--pink); color:#FFF; border:3px solid var(--ink); border-radius:100px;
    padding:9px 16px; cursor:pointer; box-shadow:3px 3px 0 var(--ink);
  }
  .dev-inspect-badge.show{ display:block; }
  .dev-drawer h3{ font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0 0 12px 0; text-transform:uppercase; letter-spacing:.5px; }
  .dev-row{ margin-bottom:10px; }
  .dev-select, .dev-textarea{
    width:100%; border:2.5px solid var(--ink); border-radius:10px; padding:8px 10px;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600; box-sizing:border-box;
  }
  .dev-textarea{ min-height:90px; resize:vertical; }
  .dev-tagcloud{ display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 10px 0; }
  .dev-tag{

function truncate(s,n){ s=(s||'').trim(); return s.length>n ? s.slice(0,n)+'…' : s; }
function normWord(w){ return w.replace(/[^a-zA-Z']/g,'').toLowerCase(); }

function kw(lines, extraClass){
  let i = 0;
  const body = lines.map(line=>{
    const words = line.map(w=>{
      const delay = (i * 0.09).toFixed(2); i++;
      return `<span class="kword" style="animation-delay:${delay}s">${w}</span>`;
    }).join(' ');
    return `<div class="kline">${words}</div>`;
  }).join('');
  return `<div class="hero-title${extraClass ? ' '+extraClass : ''}">${body}</div>`;
}

function passageWordsHTML(){
  let out = '';

    const words = v.split(/\s+/);

      const norm = normWord(w);
      return `<span class="w" data-word="${norm}" onclick="tapWord(event,this)">${w}</span>`;
    }).join(' ');
    out += `<div class="verse-line"><span class="verse-num">${i+1}</span>${spans}</div>`;
  });
  return out;
}
function versePickHTML(){

}

function buildProgressBar(){
  const row = document.getElementById('progressRow');
  row.innerHTML = '';
  let el=null, key=undefined;
  beats.forEach((b,i)=>{
    if (i===beats.length-1) return;
    if (b.cluster !== key){ el=document.createElement('div'); el.className='prog-cluster'; el.style.display='flex'; el.style.gap='3px'; el.style.flex='1'; row.appendChild(el); key=b.cluster; }
    const seg=document.createElement('div'); seg.className='seg'; seg.id=`seg-${i}`;
    const fill=document.createElement('div'); fill.className='fill'; seg.appendChild(fill);
    el.appendChild(seg);
  });
}
function updateProgressBar(){
  beats.forEach((b,i)=>{
    if (i===beats.length-1) return;
    const seg=document.getElementById(`seg-${i}`); if(!seg) return;
    seg.classList.remove('done','current','filling');
    const fill=seg.querySelector('.fill'); fill.style.animation=''; fill.classList.remove('static');
    if (i<state.index) seg.classList.add('done');
    else if (i===state.index){
      if (b.dur){ seg.classList.add('filling'); fill.style.animationDuration=b.dur+'ms'; }
      else { seg.classList.add('current'); fill.classList.add('static'); }
    }
  });
}

const stage = document.getElementById('stage');
const phoneEl = document.getElementById('phone');
beats.forEach((b,i)=>{
  const div=document.createElement('div');
  div.className = `beat ${b.text === 'light' ? 'tx-light' : 'tx-dark'}`;
  div.id = `beat-${i}`;
  div.style.background = b.bgColor;
  div.innerHTML = b.html;
  stage.appendChild(div);
});

function renderBeat(i){
  document.querySelectorAll('.beat').forEach(el=>el.classList.remove('active'));
  document.getElementById(`beat-${i}`).classList.add('active');
  document.getElementById('backCtrl').classList.toggle('show', i>0);
  clearTimeout(timerHandle);
  renderGen++;
  const myGen = renderGen;
  const b = beats[i];

  phoneEl.style.backgroundColor = b.bgColor;
  document.querySelector('.hud-header').className = 'hud-header ' + (b.text === 'light' ? 'tx-light' : 'tx-dark');

  if (b.id === 'reveal-55ad') animateYearsAgo();
  if (b.id === 'char-coaching') {
    document.getElementById('charRef').textContent = 'Mark 1:' + state.charVerse;
    document.getElementById('charText').textContent = '"' + passage[state.charVerse-1] + '"';
    updateCoachText();
    document.getElementById('coachBox').classList.toggle('show', !!(state.trait && state.trait.trim()));
  }
  if (b.id === 'final') fillFinal();
  if (b.id === 'vocab-scan') updateWordUI();
  if (b.id === 'vocab-review') renderVocabReview();
  if (b.id === 'char-verse-pick') {
    document.querySelectorAll('#beat-'+i+' .verse-tile').forEach(t=>t.classList.toggle('selected', Number(t.dataset.v)===state.charVerse));
    toggleContinue('charVerseContinue', state.charVerse !== null);
  }

  updateProgressBar();
  if (typeof updateDevToolUI === 'function') updateDevToolUI();
  if (b.type === 'auto') {
    timerHandle = setTimeout(()=>{ if (renderGen === myGen) goNext(); }, b.dur);
  }
}

function toggleContinue(id, ready){ const btn=document.getElementById(id); if (btn) btn.classList.toggle('ready', ready); }

function questAnswer(e, el, gridId, fbId, correctMsg, wrongMsg){
  e.stopPropagation();
  if (el.classList.contains('locked')) return;
  const isCorrect = el.dataset.correct === 'true';
  const fb = document.getElementById(fbId);
  if (isCorrect) {
    const grid = document.getElementById(gridId);
    grid.querySelectorAll('.quiz-tile').forEach(t=>t.classList.add('locked'));
    el.classList.add('correct');
    fb.textContent = correctMsg;
    fb.classList.remove('bad'); fb.classList.add('good','show');
    const myGen = renderGen;
    setTimeout(()=>{ if (renderGen === myGen) goNext(); }, 800);
  } else {
    el.classList.add('incorrect','shake');
    fb.textContent = wrongMsg;
    fb.classList.remove('good'); fb.classList.add('bad','show');
    setTimeout(()=>{ el.classList.remove('shake','incorrect'); }, 500);
  }
}

function animateYearsAgo(){
  const target = new Date().getFullYear() - 55;
  const el = document.getElementById('yearsAgoCount');
  if (!el) return;
  const myGen = renderGen;
  let start = null;
  const dur = 1300;
  function step(ts){
    if (renderGen !== myGen) return;
    if (!start) start = ts;
    const p = Math.min(1, (ts-start)/dur);
    el.textContent = Math.round(p * target).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function tapWord(e, el){
  e.stopPropagation();
  const word = el.dataset.word;
  if (!word) return;
  const already = el.classList.contains('flagged');
  if (already) {
    el.classList.remove('flagged');
    state.wordTaps = state.wordTaps.filter(w => w.el !== el);
  } else {
    el.classList.add('flagged');
    state.wordTaps.push({ el, word, def: defs[word] || null });
  }
  updateWordUI();
}
function updateWordUI(){
  const n = state.wordTaps.length;
  const cnt = document.getElementById('tapCount');
  if (cnt) cnt.textContent = `${n} word${n===1?'':'s'} flagged`;
  toggleContinue('wordContinue', true);
}

function renderVocabReview(){
  const box = document.getElementById('vocabReviewBox');
  if (state.wordTaps.length === 0) {
    box.innerHTML = `<div class="review-card">No words flagged! You think students know this text inside and out — awesome!</div>`;
    return;
  }
  const defined = state.wordTaps.filter(w => w.def);
  const undefinedWords = state.wordTaps.filter(w => !w.def);
  let html = defined.map(w => `<div class="review-card"><b>${w.word}:</b> ${w.def}</div>`).join('');
  if (undefinedWords.length > 0) {
    html += `<div class="pill-cloud-label">Look these up before Sunday</div>
             <div class="pill-cloud">${undefinedWords.map(w => `<div class="research-pill">${w.word}</div>`).join('')}</div>`;
  }
  box.innerHTML = html;
}

function pickCharVerse(e, v){
  e.stopPropagation();
  state.charVerse = v;
  document.querySelectorAll('.verse-tile').forEach(t=>t.classList.toggle('selected', Number(t.dataset.v)===v));
  toggleContinue('charVerseContinue', true);
}

function selectTrait(e, el, val){
  e.stopPropagation();
  document.querySelectorAll('#traitChipGrid .chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('customTraitInput').style.display = 'none';
  state.trait = val;
  updateCoachText();
  const box = document.getElementById('coachBox');
  if (box) box.classList.add('show');
}
function toggleCustomTrait(e){
  e.stopPropagation();
  document.querySelectorAll('#traitChipGrid .chip').forEach(c=>c.classList.remove('selected'));
  const inp = document.getElementById('customTraitInput');
  inp.style.display = 'block';
  inp.focus();
}
function handleCustomTrait(val){
  state.trait = val;
  updateCoachText();
  const box = document.getElementById('coachBox');
  if (box) box.classList.toggle('show', !!(val && val.trim()));
}
function updateCoachText(){
  const box = document.getElementById('coachText');
  if (!box) return;
  const trait = state.trait && state.trait.trim() ? state.trait.trim() : 'faithful and true';
  box.innerHTML = `"Looking at this verse, we see that God is <b>${trait}</b>. When we learn His character and purpose, how does that change ours?"`;
}

function fillFinal(){
  const list = document.getElementById('finalWords');
  if (state.wordTaps.length === 0) {
    list.innerHTML = `<div class="word-chip">No words flagged.</div>`;
  } else {
    list.innerHTML = state.wordTaps.map(w=>{
      const d = w.def || 'Look this one up before Sunday.';
      return `<div class="word-chip"><b>${w.word}</b> — ${d}</div>`;
    }).join('');
  }
  const fv = document.getElementById('finalVerse');
  if (state.charVerse) {
    fv.innerHTML = `<b>Mark 1:${state.charVerse}</b> — "${passage[state.charVerse-1]}"`;
  } else {
    fv.textContent = 'No verse selected.';
  }
  const trait = state.trait && state.trait.trim() ? state.trait.trim() : 'faithful and true';
  document.getElementById('finalChallenge').innerHTML = `Read Mark 1:1–20 in your own Bible before Sunday: <em>"If God is ${trait}, what will your response be this week?"</em>`;
}

function goNext(){
  const b = beats[state.index];
  if (b.blockTap) {
    if (b.id === 'char-verse-pick' && state.charVerse === null) return;
  }
  if (state.index < beats.length - 1) {
    const nextBeat = beats[state.index + 1];
    const isFlipPair = (b.id === 'reading-intro' && nextBeat.id === 'vocab-scan') ||
                        (b.id === 'character-prompt' && nextBeat.id === 'char-verse-pick');
    if (isFlipPair) {
      const curEl = document.getElementById('beat-' + state.index);
      if (curEl) {
        curEl.classList.add('page-flip-out');
        setTimeout(()=>{ curEl.classList.remove('page-flip-out'); }, 650);
      }
    }
    state.index++; renderBeat(state.index);
  }
}
function goPrev(){ if (state.index > 0) { state.index--; renderBeat(state.index); } }

let suppressClick = false;

document.getElementById('stage').addEventListener('click', (e)=>{
  if (suppressClick) { suppressClick = false; return; }
  const b = beats[state.index];
  if (b.blockTap) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x < rect.width*0.35) goPrev(); else goNext();
});
document.getElementById('backCtrl').addEventListener('click', (e)=>{ e.stopPropagation(); goPrev(); });

let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
document.getElementById('stage').addEventListener('touchstart', (e)=>{
  const t = e.changedTouches[0];
  touchStartX = t.clientX; touchStartY = t.clientY; touchStartTime = Date.now();
}, { passive: true });

document.getElementById('stage').addEventListener('touchend', (e)=>{
  const b = beats[state.index];
  if (b.blockTap) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  const isSwipe = Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 600;
  if (isSwipe) {
    suppressClick = true;
    if (dx < 0) goNext(); else goPrev();
  }
}, { passive: true });

async function exportGuide(){
  const target = document.getElementById('exportTarget');
  const wordsHTML = state.wordTaps.length === 0
    ? `<div style="font-family:'Inter',sans-serif; font-size:13px; opacity:.8;">No words flagged.</div>`
    : state.wordTaps.map(w=>{
        const d = w.def || 'Look this one up before Sunday.';
        return `<div style="font-family:'Inter',sans-serif; font-size:13.5px; line-height:1.5; margin-bottom:8px;"><b style="color:#A855F7; text-transform:capitalize;">${w.word}</b> — ${d}</div>`;
      }).join('');
  const verseHTML = state.charVerse
    ? `<div style="font-family:'Inter',sans-serif; font-weight:700; font-size:16px; line-height:1.5; color:#0D0D0D;">"${passage[state.charVerse-1]}"</div>
       <div style="font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#A855F7; margin-top:6px;">Mark 1:${state.charVerse}</div>`
    : `<div style="font-family:'Inter',sans-serif; font-size:13px;">No verse selected.</div>`;
  const trait = state.trait && state.trait.trim() ? state.trait.trim() : 'faithful and true';

  target.innerHTML = `
    <div style="font-family:'Inter',sans-serif; background:#FFF; color:#0D0D0D; padding:30px 26px; border:5px solid #0D0D0D;">
      <div style="font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#A855F7;">MS Hang · Prep Guide</div>
      <div style="font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; margin:6px 0 18px 0; text-transform:uppercase;">Mark 1:1–20</div>

      <div style="font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:#A855F7; margin-bottom:8px;">Context snapshot</div>
      <div style="font-family:'Inter',sans-serif; font-weight:700; font-size:13px; line-height:1.6; margin-bottom:18px;">Written ~AD 55, the earliest Gospel · Peter's eyewitness account, recorded by John Mark · written for persecuted believers in Rome under Nero</div>

      <div style="font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:#A855F7; margin-bottom:10px;">Words to walk through</div>
      ${wordsHTML}

      <div style="font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:#A855F7; margin:20px 0 8px 0;">This week's key verse</div>
      ${verseHTML}

      <div style="font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:#A855F7; margin:20px 0 8px 0;">Personal challenge</div>
      <div style="font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; line-height:1.5; background:#FFC72C; border:3px solid #0D0D0D; border-radius:14px; padding:12px 13px;">Read Mark 1:1–20 in your own Bible before Sunday: "If God is ${trait}, what will your response be this week?"</div>

      <div style="font-family:'Space Grotesk',sans-serif; font-size:11px; opacity:.6; margin-top:24px;">Generated ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div>
    </div>`;
  try{
    const canvas = await html2canvas(target.firstElementChild, { scale: 2, backgroundColor: null, useCORS: true });
    const filename = 'MS_Hang_Mark1_Prep.png';

    canvas.toBlob(async (blob) => {
      if (!blob) { openImageFallback(canvas.toDataURL('image/png')); return; }

      // Best mobile experience: native share sheet (Save Image / AirDrop / etc.)
      try {
        const file = new File([blob], filename, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'MS Hang Prep Guide' });
          return;
        }
      } catch (shareErr) {
        // user cancelled the share sheet, or share failed — fall through to download
      }

      // Standard download link (works on desktop and most Android browsers)
      try {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = filename;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(()=> URL.revokeObjectURL(url), 4000);
      } catch (dlErr) {
        // Last resort: open the image so it can be long-pressed and saved manually
        openImageFallback(canvas.toDataURL('image/png'));
      }
    }, 'image/png');
  } catch(err){ console.error(err); alert('Export failed. Try taking a screenshot instead.'); }
}

function openImageFallback(dataUrl){
  const w = window.open();
  if (w) {
    w.document.write('<body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="'+dataUrl+'" style="max-width:100%;height:auto;"></body>');
  } else {
    alert('Could not open the image automatically. Please take a screenshot instead.');
  }
}

/* init calls moved to the end of the script, after all declarations */

/* ============================================================
   NOTES FOR CLAUDE — lightweight in-app feedback tool
   Lets you tag specific elements and leave notes per slide,
   then copy them all as plain text to paste back into chat.
   Notes live only in this browser tab (not saved to disk).
   ============================================================ */
let devNotes = {};
let isInspecting = false;

function initDevTool(){
  const sel = document.getElementById('devSlideSelect');
  sel.innerHTML = beats.map((b,i)=>`<option value="${i}">${i}. ${b.id}</option>`).join('');
  updateDevToolUI();
}

function toggleDevDrawer(){
  const drawer = document.getElementById('devDrawer');
  const btn = document.getElementById('devToggleBtn');
  drawer.classList.toggle('open');
  btn.classList.toggle('open');
  if (drawer.classList.contains('open')) updateDevToolUI();
  else disableInspect();
}

function updateDevToolUI(){
  const b = beats[state.index];
  const label = document.getElementById('devSlideLabel');
  const sel = document.getElementById('devSlideSelect');
  const ta = document.getElementById('devNoteInput');
  if (!label || !sel || !ta) return;
  label.textContent = `#${state.index} (${b.id})`;
  sel.value = state.index;
  ta.value = devNotes[b.id] || '';
  buildDevTagCloud();
}

function buildDevTagCloud(){
  const cloud = document.getElementById('devTagCloud');
  const activeEl = document.getElementById('beat-' + state.index);
  if (!cloud || !activeEl) return;
  cloud.innerHTML = '';
  const targets = [
    { sel:'.hero-title', name:'Headline' },
    { sel:'.sub', name:'Subtext' },
    { sel:'.quiz-grid', name:'Quiz options' },
    { sel:'.stat-lines', name:'Stat cards' },
    { sel:'.verse-reveal-card', name:'Verse card' },
    { sel:'.book-page', name:'Book page graphic' },
    { sel:'.passage-card', name:'Passage card' },
    { sel:'.chip-grid', name:'Trait chips' },
    { sel:'.coach-box', name:'Coaching question' },
    { sel:'.final-card', name:'Final guide card' },
    { sel:'.breath-circle', name:'Breath circle' },
    { sel:'.continue-btn, .export-btn', name:'Button' },
  ];
  targets.forEach(t=>{
    const el = activeEl.querySelector(t.sel);
    if (el){
      const tag = document.createElement('div');
      tag.className = 'dev-tag';
      tag.textContent = '🏷️ ' + t.name;
      tag.onclick = ()=> insertTag(t.name);
      cloud.appendChild(tag);
    }
  });
}

function insertTag(label){
  const ta = document.getElementById('devNoteInput');
  ta.value += (ta.value ? '\n' : '') + `[@${label}]: `;
  ta.focus();
  saveDevNote();
}

function saveDevNote(){
  const b = beats[state.index];
  devNotes[b.id] = document.getElementById('devNoteInput').value;
}

function devJumpToSlide(val){
  state.index = Number(val);
  renderBeat(state.index);
  updateDevToolUI();
}

function toggleInspect(){
  isInspecting = !isInspecting;
  const btn = document.getElementById('devInspectBtn');
  const drawer = document.getElementById('devDrawer');
  const badge = document.getElementById('devInspectBadge');
  if (isInspecting){
    if (btn) btn.classList.add('inspecting');
    document.body.classList.add('dev-inspecting');
    if (drawer) drawer.classList.add('hide-for-inspect');
    if (badge) badge.classList.add('show');
  } else {
    disableInspect();
  }
}
function disableInspect(){
  isInspecting = false;
  const btn = document.getElementById('devInspectBtn');
  const drawer = document.getElementById('devDrawer');
  const badge = document.getElementById('devInspectBadge');
  if (btn) btn.classList.remove('inspecting');
  document.body.classList.remove('dev-inspecting');
  if (drawer) drawer.classList.remove('hide-for-inspect');
  if (badge) badge.classList.remove('show');
}

document.addEventListener('click', function(e){
  if (!isInspecting) return;
  const phoneEl = document.getElementById('phone');
  if (!phoneEl.contains(e.target)) return;
  e.preventDefault();
  e.stopPropagation();
  const label = deriveSmartName(e.target);
  insertTag(label);
  disableInspect();
}, true);

function deriveSmartName(el){
  if (el.id) return '#' + el.id;
  const card = el.closest('.quiz-tile, .verse-tile, .stat-line, .chip, .book-page, .coach-box, .verse-reveal-card, .final-card, .continue-btn, .export-btn, .breath-circle');
  let txt = (el.innerText || '').trim().replace(/\n/g,' ');
  if (txt.length > 28) txt = txt.slice(0,25) + '...';
  if (card && txt) return `${card.className.split(' ')[0]} > "${txt}"`;
  if (txt) return `"${txt}"`;
  if (el.className && typeof el.className === 'string' && el.className) return '.' + el.className.split(' ')[0];
  return el.tagName.toLowerCase();
}

async function copyAllNotes(){
  saveDevNote();
  const lines = beats.map((b,i)=>{
    const note = devNotes[b.id];
    return note && note.trim() ? `Slide ${i} (${b.id}):\n${note.trim()}` : null;
  }).filter(Boolean);
  const text = lines.length ? lines.join('\n\n') : 'No notes yet.';
  const btn = document.getElementById('devCopyBtn');
  let copied = false;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(text); copied = true; } catch(err) { copied = false; }
  }
  if (!copied) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      copied = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch(err) { copied = false; }
  }

  if (copied) {
    btn.classList.add('copied');
    btn.textContent = '✅ Copied!';
    setTimeout(()=>{ btn.classList.remove('copied'); btn.textContent = '📋 Copy all notes'; }, 2000);
  } else {
    alert('Could not copy automatically — select and copy this text manually:\n\n' + text);
  }
}

buildProgressBar();
renderBeat(0);
initDevTool();
</script>

<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dwell Bookmark</title>
<meta name="description" content="Dwell: a guide for meditating on Scripture daily. Five steps that fit in your Bible.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600&family=Josefin+Slab:ital,wght@0,400;1,400&family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dwell-bookmark.css">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ffffff">
<!-- The original Dwell bookmark, front and back, with a printable sheet. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #111; }
  body { font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .top { display: flex; align-items: center; height: 72px; padding: 0 20px; }
  .top img { height: 40px; width: auto; display: block; }
  main { padding: 4px 16px 0; }
  .faces { display: flex; gap: 24px; justify-content: center; align-items: flex-start; }
  figure { margin: 0; width: min(44vw, (100svh - 110px) * 264 / 612); }
  .fw { container-type: inline-size; border: 1px solid #d5d9de; border-radius: 4px; overflow: hidden; box-shadow: 0 8px 26px rgba(0,0,0,.10); }
  .fw .dwb { --u: calc(100cqw / 264); text-align: left; }
  .dl { max-width: 620px; margin: 0 auto; padding: 36px 20px 72px; }
  .dl h2 { font: 700 12px/1 'DM Sans', sans-serif; letter-spacing: .18em; text-transform: uppercase; margin: 0 0 16px; }
  .starts { display: flex; flex-wrap: wrap; gap: 10px; }
  .starts a { border: 1.5px solid #111; border-radius: 99px; padding: 11px 18px; font: 700 14px/1 'DM Sans', sans-serif; color: #111; text-decoration: none; background: #111; color: #fff; }
  .dl .note { margin: 12px 0 0; font-size: 13.5px; color: #6b7480; }
  @media (max-width: 600px) { .faces { flex-direction: column; align-items: center; gap: 20px; } figure { width: min(100%, 420px); } }
</style></head>
<body>
  <header class="top"><a href="/dwell" aria-label="Dwell Bookmark"><img src="/icons/dwell-title.png" alt="Dwell"></a></header>
  <main>
    <div class="faces">
      <figure aria-label="Front"><div class="fw"><div class="dwb side-a"><div class="hd"><div class="strip"><i></i><i></i><i></i><i></i><i></i></div><img class="wm" src="/icons/dwell-title.png" alt="Dwell"><div class="tag">a guide for meditating<br>on Scripture daily</div></div><p class="pray">Lord, grant me the spirit of wisdom and revelation in the knowledge of who You are. Amen.</p><div class="bar sage"><span class="n">1</span><span class="pipe">|</span>DISCOVER<span class="ic"><img src="/icons/discover.png" alt=""></span></div><p>Use a study Bible or trusted online resource to review historical context:</p><div class="ctx"><span>author</span><span>time frame</span><span>audience</span><span>purpose</span></div><p>Put away extra resources for now and read through the passage slowly, taking note of key characters and settings.</p><div class="bar sage"><span class="n">2</span><span class="pipe">|</span>WORD WORK<span class="ic"><img src="/icons/word-work.png" alt=""></span></div><p>Reread the passage&mdash;which words or phrases are being emphasized? (Look for repetition, lists, comparisons, etc.)</p><p>Which words need more clarity? Look them up&mdash;what do you learn?</p><p>How would you summarize the passage in <span style="white-space:nowrap">1&ndash;2</span> sentences?</p></div></div></figure>
      <figure aria-label="Back"><div class="fw"><div class="dwb side-b"><p class="pray" style="margin-top:calc(4 * var(--u))">Lord, correct any lies I believe. Let this knowledge increase my love for You and others, not my pride. Amen.</p><div class="bar slate"><span class="n">3</span><span class="pipe">|</span>EVALUATE<span class="ic"><img src="/icons/evaluate.png" alt=""></span></div><p>Reread the passage&mdash;what questions come to mind?</p><p>Review other translations, cross references &amp; surrounding passages&mdash;do they shed any light on your questions?</p><p style="margin-bottom:calc(22 * var(--u))">How would the original audience have understood this passage?</p><div class="bar slate"><span class="n">4</span><span class="pipe">|</span>LEARN<span class="ic"><img src="/icons/learn.png" alt=""></span></div><p>What truth does this passage reveal about God&rsquo;s character and purpose?</p><p>What cultural or personal lies does this truth challenge today?</p><p style="margin-bottom:calc(26 * var(--u))"><em>Check your findings in community.</em></p><div class="bar rose"><span class="n">5</span><span class="pipe">|</span>LIVE<span class="ic"><img src="/icons/live.png" alt=""></span></div><p>How will this truth shape your prayers, thoughts, words and/or actions today?</p></div></div></figure>
    </div>
  </main>
  <section class="dl">
    <h2>Download</h2>
    <div class="starts"><a href="/dwell-bookmark-sheet.pdf" download="Dwell Bookmark.pdf">Bookmark PDF &darr;</a></div>
    <p class="note">Prints three to a page, front and back. Cut along the lines.</p>
  </section>
</body>
</html>

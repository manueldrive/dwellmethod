<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dwell Bookmark</title>
<meta name="description" content="Dwell: a guide for meditating on Scripture daily. Five steps that fit in your Bible.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600&family=Josefin+Slab:ital,wght@0,400;1,400&family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dwell-bookmark.css">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ffffff">
<!-- The original Dwell bookmark, front and back, with a printable sheet. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #111; }
  body { font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .back { display: inline-block; margin: 20px 20px 0; font: 700 13px/1 'DM Sans', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #111; text-decoration: none; }
  .back:hover { text-decoration: underline; text-underline-offset: 4px; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 64px; text-align: center; }
  h1 { font: 700 clamp(30px, 6vw, 42px)/1.05 'Fraunces', serif; margin: 0 0 10px; }
  .sub { font-size: 16.5px; line-height: 1.5; color: #3d4450; margin: 0 auto 30px; max-width: 30em; }
  .faces { display: flex; gap: 22px; justify-content: center; align-items: flex-start; margin-bottom: 32px; }
  figure { margin: 0; flex: 0 1 340px; }
  .fw { container-type: inline-size; border: 1px solid #d5d9de; border-radius: 4px; overflow: hidden; box-shadow: 0 8px 26px rgba(0,0,0,.10); }
  .fw .dwb { --u: calc(100cqw / 264); text-align: left; }
  figcaption { margin-top: 10px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #6b7480; }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-block; background: #111; color: #fff; border: 1.5px solid #111; border-radius: 99px; padding: 12px 20px; font: 700 14px/1 'DM Sans', sans-serif; letter-spacing: .04em; text-decoration: none; }
  .btn.ghost { background: #fff; color: #111; }
  .note { margin-top: 14px; font-size: 13.5px; color: #6b7480; }
  @media (max-width: 600px) { .faces { flex-direction: column; align-items: center; } figure { flex: none; width: min(100%, 340px); } }
</style></head>
<body>
  <a class="back" href="/">&larr; Home</a>
  <main>
    <h1>Dwell Bookmark</h1>
    <p class="sub">A guide for meditating on Scripture daily. Pray, then work through five steps with your passage.</p>
    <div class="faces">
      <figure><div class="fw"><div class="dwb side-a"><div class="hd"><div class="strip"><i></i><i></i><i></i><i></i><i></i></div><svg class="leaf" viewBox="0 0 120 150" aria-hidden="true"><g fill="#dde6de" stroke="#7d968a" stroke-width="1.6" stroke-linejoin="round">
<path d="M18 140 C40 110 62 70 104 12" fill="none"/>
<path d="M30 122 C14 116 4 102 2 86 C18 90 30 104 30 122Z"/><path d="M34 116 C50 112 60 100 64 84 C48 88 36 100 34 116Z"/>
<path d="M46 98 C30 92 20 78 18 62 C34 66 46 80 46 98Z"/><path d="M52 90 C68 86 78 74 82 58 C66 62 54 74 52 90Z"/>
<path d="M64 74 C48 68 40 54 38 38 C54 42 64 56 64 74Z"/><path d="M72 64 C88 60 98 48 102 32 C86 36 74 48 72 64Z"/>
<path d="M86 44 C76 34 72 22 74 8 C86 16 90 30 86 44Z"/><path d="M92 36 C104 34 112 26 116 14 C104 16 94 24 92 36Z"/></g>
<g fill="none" stroke="#9fb3a7" stroke-width=".8"><path d="M30 122 C22 110 12 96 2 86"/><path d="M34 116 C44 106 54 96 64 84"/><path d="M46 98 C36 86 26 74 18 62"/><path d="M52 90 C62 80 72 70 82 58"/><path d="M64 74 C54 62 46 50 38 38"/><path d="M72 64 C82 54 92 44 102 32"/></g></svg><img class="wm" src="/dwell-wordmark.svg" alt="Dwell"><div class="tag">a guide for meditating<br>on Scripture daily</div><div class="qr"><img src="/dwell-qr.svg" alt="QR code to dwellstudy.com"></div></div><p class="pray">Lord, grant me the spirit of wisdom and revelation in the knowledge of who You are. Amen.</p><div class="bar sage"><span class="n">1</span><span class="pipe">|</span>DISCOVER<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2f36" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/><path d="M7 8.5a3.5 3.5 0 0 1 3-2.5" stroke-width="1.1"/></svg></span></div><p>Use a study Bible or trusted online resource to review historical context:</p><div class="ctx"><span>author</span><span>time frame</span><span>audience</span><span>purpose</span></div><p>Put away extra resources for now and read through the passage slowly, taking note of key characters and settings.</p><div class="bar sage"><span class="n">2</span><span class="pipe">|</span>WORD WORK<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2f36" stroke-width="1.5" stroke-linejoin="round"><path d="M14.5 3.5l6 6-8.5 8.5-6-6z"/><path d="M6 12l-1.5 6 1.5 1.5 6-1.5" /><path d="M4.5 18L3 21h3" /><path d="M15.5 5l3.5 3.5" stroke-width="1"/><path d="M8 13.5l2.5 2.5" fill="#2b2f36"/></svg></span></div><p>Reread the passage&mdash;which words or phrases are being emphasized? (Look for repetition, lists, comparisons, etc.)</p><p>Which words need more clarity? Look them up&mdash;what do you learn?</p><p>How would you summarize the passage in <span style="white-space:nowrap">1&ndash;2</span> sentences?</p></div></div><figcaption>Front</figcaption></figure>
      <figure><div class="fw"><div class="dwb side-b"><p class="pray" style="margin-top:calc(4 * var(--u))">Lord, correct any lies I believe. Let this knowledge increase my love for You and others, not my pride. Amen.</p><div class="bar slate"><span class="n">3</span><span class="pipe">|</span>EVALUATE<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2f36" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M7 4h11a2 2 0 0 1 2 2v1h-3"/><path d="M7 4a2 2 0 0 0-2 2v12"/><path d="M17 4.2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1h12v1a2 2 0 0 0 2 2"/><path d="M8 8h6M8 11h6M8 14h4" stroke-width="1.1"/></svg></span></div><p>Reread the passage&mdash;what questions come to mind?</p><p>Review other translations, cross references &amp; surrounding passages&mdash;do they shed any light on your questions?</p><p style="margin-bottom:calc(22 * var(--u))">How would the original audience have understood this passage?</p><div class="bar slate"><span class="n">4</span><span class="pipe">|</span>LEARN<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2f36" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M12 9v11"/><path d="M12 10c-2-1.4-5-1.6-8-1v10c3-.6 6-.4 8 1 2-1.4 5-1.6 8-1V9c-3-.6-6-.4-8 1z"/><path d="M12 2v4M10 4h4" stroke-width="1.3"/><path d="M7.5 3.5l1 1.5M16.5 3.5l-1 1.5M5.5 6.5l1.5.7M18.5 6.5l-1.5.7" stroke-width="1"/></svg></span></div><p>What truth does this passage reveal about God&rsquo;s character and purpose?</p><p>What cultural or personal lies does this truth challenge today?</p><p style="margin-bottom:calc(26 * var(--u))"><em>Check your findings in community.</em></p><div class="bar rose"><span class="n">5</span><span class="pipe">|</span>LIVE<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2f36" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 20.5S3.5 15.2 3.5 9.2A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 8.5 1.8c0 6-8.5 11.3-8.5 11.3z" fill="#f4dedd"/><path d="M12 9.5v7M9.5 12h5" stroke-width="1.6"/></svg></span></div><p>How will this truth shape your prayers, thoughts, words and/or actions today?</p></div></div><figcaption>Back</figcaption></figure>
    </div>
    <div class="acts">
      <a class="btn" href="/dwell-bookmark-sheet.pdf" download="Dwell Bookmark.pdf">Download to print</a>
      <a class="btn ghost" href="/guidedsoar">Guided SOAR</a>
    </div>
    <p class="note">Prints three to a page. Cut along the lines.</p>
  </main>
</body>
</html>

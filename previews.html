<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MS Hang Prep — Mark 1:21–45</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800;900&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --paper:#FFFFFF;
    --cream:#EAE6DF;
    --lime:#C3F53C;
    --pink:#F43F5E;
    --blue:#38BDF8;
    --yellow:#FFC72C;
    --purple:#A855F7;

    /* Dynamic gradient presets */
    --bg-lime: linear-gradient(145deg, #d2f860 0%, #a2e014 100%);
    --bg-purple: linear-gradient(145deg, #b862f8 0%, #7e22ce 100%);
    --bg-pink: linear-gradient(145deg, #fb5672 0%, #be123c 100%);
    --bg-dark: linear-gradient(145deg, #262626 0%, #050505 100%);
    --bg-cream: linear-gradient(145deg, #f4f0e8 0%, #d8d2c7 100%);
    --bg-yellow: linear-gradient(145deg, #ffd452 0%, #eab308 100%);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background:#000; font-family:'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior:none; }
  .phone{ position:relative; width:100%; max-width:430px; height:100vh; height:100dvh; margin:0 auto; background:var(--bg-cream); overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,0.5); display:flex; flex-direction:column; transition:background .4s ease; }
  @media (min-width:431px){ body{ display:flex; align-items:center; justify-content:center; } .phone{ height:90vh; height:90dvh; border-radius:36px; border:4px solid #FFF; } }

  /* HEADER & CONTINUOUS PROGRESS BAR */
  .hud-header{ position:relative; z-index:50; padding:16px 18px 6px 18px; display:flex; flex-direction:column; gap:8px; }
  .progress-container{ position:relative; width:100%; height:6px; background:rgba(13,13,29,0.18); border-radius:100px; }
  .tx-light .progress-container{ background:rgba(255,255,255,0.25); }
  .progress-bar-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--ink); border-radius:100px; transition:width .3s cubic-bezier(.2,.8,.25,1); }
  .tx-light .progress-bar-fill{ background:#FFF; }
  
  .notches-layer{ position:absolute; inset:0; pointer-events:none; }
  .prog-notch{ position:absolute; top:50%; transform:translate(-50%, -50%); width:8px; height:8px; border-radius:50%; background:rgba(13,13,29,0.3); border:1.5px solid rgba(255,255,255,0.6); transition:all .25s ease; }
  .tx-light .prog-notch{ background:rgba(255,255,255,0.4); border-color:rgba(0,0,0,0.3); }
  .prog-notch.passed{ background:var(--lime); border-color:var(--ink); }
  .prog-notch.active{ width:11px; height:11px; background:var(--yellow); border-color:var(--ink); box-shadow:0 0 8px rgba(0,0,0,0.3); animation:notchPulse 1.2s infinite ease-in-out; }
  @keyframes notchPulse{ 0%,100%{ transform:translate(-50%, -50%) scale(1); } 50%{ transform:translate(-50%, -50%) scale(1.25); } }

  .story-meta{ display:flex; justify-content:space-between; font-family:'Space Grotesk', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:.8; }

  .stage{ position:relative; flex:1; overflow:hidden; z-index:1; perspective:1400px; }
  .beat{ position:absolute; inset:0; display:flex; flex-direction:column; padding:16px 20px 20px 20px; opacity:0; transform:translateY(10px) scale(0.98); transition:opacity .25s ease, transform .25s ease; pointer-events:none; z-index:1; }
  .beat.active{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; z-index:2; }
  .tx-dark{ color:var(--ink); }
  .tx-light{ color:#FFF; }

  /* PAGE FLIP TRANSITION */
  .beat.page-flip-out{
    animation: pageFlipOut .6s cubic-bezier(.45,.05,.55,.95) forwards;
    transform-origin: left center;
    backface-visibility: hidden;
    z-index:5 !important;
  }
  @keyframes pageFlipOut{
    0%{ transform:rotateY(0deg); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:rotateY(-100deg); opacity:0; }
  }

  .kicker{ font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; opacity:.8; margin-bottom:6px; position:relative; z-index:2; }
  .emoji{ font-size:42px; line-height:1; margin-bottom:6px; position:relative; z-index:2; }

  /* INTRO SLIDE TYPOGRAPHY HIERARCHY */
  .intro-top-title{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:.85; margin-bottom:12px; }
  .intro-duration{ font-family:'Space Grotesk', sans-serif; font-size:13.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; opacity:.6; margin-top:16px; display:flex; align-items:center; gap:8px; }

  .hero-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2; }
  .kline{ overflow:hidden; margin-bottom:2px; }
  .kline:last-child{ margin-bottom:0; }
  .kword{ display:inline-block; opacity:0; transform:translateY(16px) scale(0.92); font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-0.3px; text-transform:uppercase; }
  .beat.active .kword{ animation:kwIn .5s cubic-bezier(.2,.85,.25,1) forwards; }
  @keyframes kwIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  .hero-title .kword{ font-size:clamp(30px, 10.5vw, 44px); line-height:1.12; }
  .hero-title.tight .kword{ font-size:clamp(23px, 7.6vw, 32px); line-height:1.18; }
  .hero-title.xl .kword{ font-size:clamp(36px, 12.5vw, 54px); line-height:1.1; }

  .sub{ font-family:'Inter', sans-serif; font-size:16.5px; font-weight:800; line-height:1.42; opacity:.92; margin-top:10px; position:relative; z-index:2; }
  .folder-wrap{ margin-top:14px; display:flex; flex-direction:column; justify-content:flex-start; flex:1; position:relative; z-index:2; }
  .folder-tab{ align-self:flex-start; margin-left:8px; background:#E4B563; border:3.5px solid var(--ink); border-bottom:none; border-radius:10px 10px 0 0; padding:6px 16px 8px 16px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink); position:relative; z-index:3; margin-bottom:-4px; flex-shrink:0; }
  .folder-body{ display:flex; flex-direction:column; justify-content:space-evenly; background:#F3D48B; border:3.5px solid var(--ink); border-radius:3px 16px 16px 16px; box-shadow:5px 5px 0 var(--ink); padding:10px 18px; position:relative; z-index:2; flex-shrink:0; gap:10px; }
  .stat-line{ display:flex; gap:14px; align-items:center; font-family:'Inter', sans-serif; font-size:16px; font-weight:800; line-height:1.48; padding:6px 0; color:var(--ink); }
  .stat-line .bullet-icon{ font-size:19px; line-height:1; flex-shrink:0; width:44px; height:44px; border-radius:50%; background:var(--ink); color:#F3D48B; display:flex; align-items:center; justify-content:center; }
  .stat-line em{ font-style:normal; color:#B0413E; }

  /* EXPAND / FULL-BLEED BOTTOM-LEFT GAUGE WITH FLUID, SMOOTH-DECELERATING TRANSITIONS */
  .zoom-stage{ flex:1; display:flex; flex-direction:column; min-height:0; position:relative; z-index:2; justify-content:space-between; }
  .zoom-caption{ font-family:'Inter',sans-serif; font-size:16.5px; font-weight:800; line-height:1.45; text-align:left; padding:8px 4px 0 4px; opacity:.96; position:relative; z-index:3; }
  .zoom-graphic{ flex:1; min-height:0; display:flex; align-items:flex-end; justify-content:flex-start; margin: 0 -20px -20px -20px; overflow:hidden; position:relative; }

  /* COMPACT CROSS REFERENCES LAYOUT WITH TOP-RIGHT CONCENTRIC RINGS CALLBACK */
  .rings-bg{ position:absolute; top:-40px; right:-50px; width:220px; height:220px; z-index:0; pointer-events:none; }
  .rings-bg span{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border-radius:50%; border:1.5px solid rgba(255,255,255,0.12); }
  .rings-bg .r1{ width:220px; height:220px; }
  .rings-bg .r2{ width:160px; height:160px; }
  .rings-bg .r3{ width:105px; height:105px; }
  .rings-bg .r4{ width:50px; height:50px; border-color:rgba(195,245,60,0.35); }

  .xref-compact-list{ flex:1; display:flex; flex-direction:column; justify-content:space-evenly; gap:10px; position:relative; z-index:2; margin-top:4px; }
  .xref-item{ display:flex; gap:13px; align-items:center; position:relative; }
  .xref-icon-node{ width:42px; height:42px; border-radius:50%; background:var(--lime); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; border:2.5px solid var(--ink); }
  .xref-content{ flex:1; display:flex; flex-direction:column; gap:2px; }
  .xref-meta-line{ display:flex; align-items:baseline; justify-content:flex-start; margin-bottom:2px; }
  .xref-topic{ font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:800; letter-spacing:0.8px; text-transform:uppercase; color:var(--lime); }
  .xref-body{ font-family:'Inter',sans-serif; font-size:14.5px; font-weight:700; line-height:1.5; color:rgba(255,255,255,0.92); }
  .xref-body em{ font-style:normal; color:var(--lime); }

  /* SUBTLE NAVIGATION HINTS */
  .tap-hint{ font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:.85; margin-top:auto; text-align:center; padding-top:8px; position:relative; z-index:5; transition:all .2s ease; min-height:34px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .swipe-hint{ display:flex; align-items:center; justify-content:center; gap:22px; }
  .swipe-hint i{ font-size:18px; }
  .swipe-hint .fa-chevron-left{ animation:nudgeLeft 1.6s ease-in-out infinite; }
  .swipe-hint .fa-chevron-right{ animation:nudgeRight 1.6s ease-in-out infinite; }
  @keyframes nudgeLeft{ 0%,100%{ transform:translateX(0); opacity:.45; } 50%{ transform:translateX(-5px); opacity:1; } }
  @keyframes nudgeRight{ 0%,100%{ transform:translateX(0); opacity:.45; } 50%{ transform:translateX(5px); opacity:1; } }

  .nav-subtle-caption{ font-family:'Space Grotesk', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; opacity:.65; margin-top:4px; }

  /* BIBLE DOCK BUTTON */
  .pill-dock-integrated{ width:100%; margin-top:auto; position:relative; z-index:5; }
  .focus-pill-dock{ width:100%; border:3.5px solid var(--ink); border-radius:100px; padding:12px 18px; text-align:center; background:rgba(255,255,255,0.45); opacity:.6; box-shadow:3px 3px 0 rgba(13,13,13,0.3); cursor:pointer; transition:all .22s ease; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--ink); }
  .focus-pill-dock.ready{ opacity:1; background:var(--lime); box-shadow:4px 4px 0 var(--ink); }
  #vocabPill.ready{ background:var(--yellow); }
  .focus-pill-dock.ready:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .focus-pill-dock.warn{ animation:shakeX .45s; background:var(--yellow) !important; opacity:1 !important; color:var(--ink) !important; border-color:var(--ink) !important; }

  /* QUIZ GRID & TESTAMENT TILES */
  .quiz-grid{ display:flex; flex-direction:column; gap:11px; margin-top:6px; position:relative; z-index:2; overflow-y:auto; padding:2px 8px 8px 2px; }
  .quiz-grid.fill-grid{ flex:1; }
  .quiz-grid.fill-grid .quiz-tile{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .quiz-tile.testament-tile{ text-align:center; }
  .quiz-tile.testament-tile .qt-title-big{ display:block; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; margin-bottom:12px; }
  .quiz-tile.testament-tile .qt-badge-under{ display:inline-block; font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:700; background:var(--ink); color:#FFF; padding:7px 16px; border-radius:100px; letter-spacing:.3px; margin-bottom:18px; }
  .quiz-tile.testament-tile.correct .qt-badge-under, .quiz-tile.testament-tile.incorrect .qt-badge-under{ background:rgba(0,0,0,0.3); }
  .quiz-tile.testament-tile .qt-desc-big{ display:block; font-family:'Inter',sans-serif; font-size:15px; font-weight:700; opacity:.75; line-height:1.45; max-width:270px; }
  .quiz-tile{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16.5px; background:#FFF; color:var(--ink); border:3.5px solid var(--ink); border-radius:16px; padding:13px 15px; cursor:pointer; transition:all .13s ease; box-shadow:4px 4px 0 var(--ink); }
  .quiz-tile:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
  .quiz-tile .qt-desc{ display:block; font-family:'Inter',sans-serif; font-size:11.5px; font-weight:700; opacity:.7; margin-top:3px; text-transform:none; letter-spacing:0; }
  .qt-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .qt-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16.5px; }
  .qt-badge-inline{ font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:700; background:var(--ink); color:#FFF; padding:3px 9px; border-radius:100px; white-space:nowrap; flex-shrink:0; }
  .quiz-tile.correct .qt-badge-inline, .quiz-tile.incorrect .qt-badge-inline{ background:rgba(0,0,0,0.25); }
  .quiz-tile.correct{ background:var(--lime) !important; color:var(--ink) !important; box-shadow:4px 4px 0 var(--ink) !important; }
  .quiz-tile.incorrect{ background:var(--pink) !important; color:#FFF !important; }
  .quiz-tile.locked{ pointer-events:none; }
  @keyframes shakeX{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
  .quiz-tile.shake{ animation:shakeX .45s; }

  .passage-scroll-wrap{ flex:1; position:relative; min-height:0; display:flex; }
  .passage-scroll{ overflow-y:auto; flex:1; padding:16px 4px 4px 0; color:var(--ink); }
  .flow-para{ margin:0 0 16px 0; font-size:18.5px; line-height:1.62; font-family:'Inter',sans-serif; font-weight:700; }
  .verse-num-inline{ font-family:'Space Grotesk', sans-serif; font-weight:700; color:var(--purple); font-size:.65em; vertical-align:super; margin:0 2px 0 6px; }
  .w{ cursor:pointer; padding:2px 1px; border-radius:3px; transition:background .15s ease; }
  .w-plain{ padding:2px 1px; }
  .w.flagged{ background:var(--yellow); font-weight:900; }

  .review-section-header{ font-family:'Space Grotesk', sans-serif; font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--ink); opacity:.75; margin:14px 0 6px 0; display:flex; align-items:center; gap:6px; }
  .review-section-header:first-child{ margin-top:4px; }
  .review-card{ background:#FFF; border:3px solid var(--ink); border-radius:14px; padding:12px 14px; margin-bottom:10px; font-family:'Inter', sans-serif; font-size:13.5px; font-weight:700; line-height:1.4; box-shadow:3px 3px 0 var(--ink); color:var(--ink); position:relative; z-index:2; }
  .review-card b{ color:var(--purple); text-transform:capitalize; }
  .review-scroll{ flex:1; overflow-y:auto; position:relative; z-index:2; padding:2px 8px 8px 2px; }
  .pill-cloud{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .research-pill{ font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:700; background:var(--ink); color:#FFF; padding:7px 13px; border-radius:100px; text-transform:capitalize; }

  .verse-pick-list{ overflow-y:auto; flex:1; margin-top:0; position:relative; z-index:2; padding:2px 4px 4px 0; }
  .verse-tile{ display:flex; gap:9px; align-items:flex-start; padding:11px 8px; cursor:pointer; transition:background .13s ease; color:var(--ink); border-radius:14px; }
  .verse-tile.selected{ background:var(--lime); }
  .verse-tile .vnum{ font-family:'Space Grotesk', sans-serif; font-weight:700; color:var(--purple); flex-shrink:0; width:22px; }
  .verse-tile .vtext{ font-size:18.5px; line-height:1.4; font-family:'Inter',sans-serif; font-weight:700; }

  .dark-scripture-card{ background:var(--ink); color:#FFF; border:3.5px solid var(--ink); border-radius:18px; padding:14px; box-shadow:4px 4px 0 rgba(0,0,0,0.25); flex-shrink:0; position:relative; z-index:2; }
  .dark-scripture-card .ref{ font-family:'Space Grotesk', sans-serif; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--lime); margin-bottom:4px; }
  .dark-scripture-card .vt{ font-style:normal; font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; line-height:1.4; opacity:.95; }

  /* CIRCLE HERO SLIDE */
  .circle-hero-container{ position:relative; z-index:2; flex-shrink:0; display:flex; justify-content:center; margin:8px 0; }
  .circle-hero{ width:250px; height:250px; border-radius:50%; background:#FFF; color:var(--ink); border:4px solid var(--ink); box-shadow:6px 6px 0 var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; flex-shrink:0; }
  .circle-hero .arc-stem-text{ font-family:'Space Grotesk', sans-serif; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px; opacity:.65; margin-bottom:6px; }
  .circle-hero .label-god-is{ font-family:'Space Grotesk', sans-serif; font-weight:800; font-size:28px; letter-spacing:-.5px; text-transform:uppercase; line-height:1; margin-bottom:12px; }
  .blank-input{ width:88%; border:none; border-bottom:3.5px solid var(--ink); background:transparent; font-family:'Inter', sans-serif; font-size:18px; font-weight:800; text-align:center; outline:none; color:var(--purple); padding:2px 0; transition:all .2s ease; }
  .blank-input.ghost{ color:rgba(13,13,29,.35); font-style:italic; }

  .inline-tip{ margin-top:8px; margin-bottom:4px; position:relative; z-index:2; flex-shrink:0; color:var(--ink); opacity:0; transform:translateY(6px); transition:all .25s ease; }
  .inline-tip.show{ opacity:1; transform:translateY(0); }
  .inline-tip .tip-text{ font-family:'Inter', sans-serif; font-size:12px; font-weight:700; line-height:1.4; }
  .inline-tip .tip-text b{ font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:.5px; }

  .breath-visual{ position:relative; width:200px; height:200px; margin:44px auto 22px auto; flex-shrink:0; }
  .breath-circle{ position:absolute; inset:0; border-radius:50%; background:var(--purple); border:4px solid var(--ink); transform:scale(0.8); z-index:2; }
  .beat.active .breath-circle{ animation:breathe 9s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ transform:scale(0.8); background:var(--purple); } 50%{ transform:scale(1.2); background:var(--lime); } }
  .breath-label-wrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:3; pointer-events:none; }
  .breath-label{ position:absolute; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink); opacity:0; }
  .breath-label.inhale{ opacity:1; }
  .beat.active .breath-label.inhale{ animation:breathLabelInhale 9s ease-in-out infinite; }
  .beat.active .breath-label.exhale{ animation:breathLabelExhale 9s ease-in-out infinite; }
  @keyframes breathLabelInhale{ 0%{ opacity:1; } 45%{ opacity:1; } 50%{ opacity:0; } 100%{ opacity:0; } }
  @keyframes breathLabelExhale{ 0%,50%{ opacity:0; } 55%{ opacity:1; } 95%{ opacity:1; } 100%{ opacity:0; } }


  .final-card{ background:#FFF; color:var(--ink); border:4px solid var(--ink); border-radius:22px; padding:18px; position:relative; z-index:2; overflow-y:auto; flex:1; min-height:0; box-shadow:5px 5px 0 var(--ink); display:flex; flex-direction:column; }
  .final-card .fhdr{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .final-card .fhdr .fbadge{ font-family:'Space Grotesk',sans-serif; font-size:9px; font-weight:700; background:var(--lime); border:2px solid var(--ink); padding:4px 10px; border-radius:100px; text-transform:uppercase; }
  .final-card .flabel{ font-family:'Space Grotesk', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase; color:#666; margin-bottom:5px; margin-top:13px; }
  .final-card .flabel:first-child{ margin-top:0; }
  .word-chip-list{ display:flex; flex-direction:column; gap:6px; }
  .word-chip{ font-family:'Inter', sans-serif; font-size:12.5px; font-weight:700; line-height:1.4; }
  .word-chip b{ text-transform:capitalize; color:var(--pink); }
  .journal-prompt-box{ background:rgba(168,85,247,0.1); border:2px dashed var(--purple); border-radius:12px; padding:10px 12px; margin-top:6px; font-size:11.5px; font-weight:700; line-height:1.45; color:var(--ink); }
  .challenge-box{ background:rgba(168,85,247,0.1); border:2px dashed var(--purple); border-radius:12px; padding:11px 13px; margin-top:6px; font-weight:700; font-size:11.5px; line-height:1.45; color:var(--ink); }

/* THEOLOGICAL GLOSSARY WITH EXPANDED DEMON/SPIRIT DEFINITION (GFC UNSEEN SERIES) */
const defs = {
  "sabbath":"The traditional Jewish day of rest and worship (Saturday).",
  "synagogue":"A Jewish house of prayer and community center for studying Scripture.",
  "impurespirit":"Another name for a demon: a created, fallen angel operating in spiritual rebellion under Satan's hierarchy. Real and deceptive, but finite: not all-powerful, all-knowing, or a match for Christ's authority.",

/* Multi-word terms that should flag/define as a single unit rather than word-by-word.

const phrases = [
  { words:['holy','one','of','god'], key:'holyoneofgod' },
  { words:['jesus','of','nazareth'], key:'jesusofnazareth' },
  { words:['impure','spirit'], key:'impurespirit' },

function quoteVerse(text){
  const t = (text||'').trim();
  const startsWithQuote = /^["“]/.test(t);
  const endsWithQuote = /["”]$/.test(t);
  return (startsWithQuote ? '' : '"') + text + (endsWithQuote ? '' : '"');
}
function normWord(w){ return w.replace(/[^a-zA-Z']/g,'').toLowerCase(); }

const stopWords = new Set(['a','an','the','and','but','or','nor','for','so','yet','of','to','in','on','at','by','with','from','into','onto','up','out','off','over','under','again','then','than','as','is','am','are','was','were','be','been','being','he','she','it','they','him','her','them','his','its','their','this','that','these','those','who','whom','whose','which','what','i','you','we','me','us','my','your','our','not','no','all','any','some','there','here','when','where','why','how','went','come','came','said','say','says','saw','see','seen','got','get','gets','made','make','makes','took','take','taken','knew','know','known','told','tell','asked','ask','gave','give','given','put','let','called','call','began','begin','left','leave','found','find','ran','run','stood','stand','sat','sit','looked','look','walked','walk','brought','bring','heard','hear','felt','feel','thought','think','wanted','want','one','two','three','man','men','people','day','days','time','way','down','after','before','while','because','if','also','just','only','very','too','back','away','still','around','about','once','more','other','many','much']);

function kw(lines, extraClass){
  let i = 0;
  const body = lines.map(line=>{
    const words = line.map(w=>{
      const delay = (i * 0.09).toFixed(2); i++;
      return `<span class="kword" style="animation-delay:${delay}s">${w}</span>`;
    }).join(' ');
    return `<div class="kline">${words}</div>`;
  }).join('');
  return `<div class="hero-title${extraClass ? ' '+extraClass : ''}">${body}</div>`;
}

const paragraphEnds = [28, 31, 34, 39, 44, 45];

function passageWordsHTML(){
  let out = '<p class="flow-para">';
  passage.forEach((v,i)=>{
    const verseNum = i + 21;
    const words = v.replace(/—(?=\S)/g, '— ').split(/\s+/);
    const normed = words.map(normWord);
    const pieces = [];
    let wi = 0;
    while (wi < words.length) {
      const marker = wi === 0 ? `<span class="verse-num-inline">${verseNum}</span>` : '';
      const match = phrases.find(p => p.words.every((pw,k) => normed[wi+k] === pw));
      if (match) {
        const span = words.slice(wi, wi + match.words.length).join(' ');
        pieces.push(`${marker}<span class="w" data-word="${match.key}" onclick="tapWord(event,this)">${span}</span>`);
        wi += match.words.length;
        continue;
      }
      const norm = normed[wi];
      if (stopWords.has(norm)) {
        pieces.push(`${marker}<span class="w-plain">${words[wi]}</span>`);
      } else {
        pieces.push(`${marker}<span class="w" data-word="${norm}" onclick="tapWord(event,this)">${words[wi]}</span>`);
      }
      wi++;
    }
    out += pieces.join(' ') + ' ';
    if (paragraphEnds.includes(verseNum) && verseNum !== 45) out += '</p><p class="flow-para">';
  });
  out += '</p>';
  return out;
}

function versePickHTML(){

function zoomRings(activeIdx){
  const cx = 0, cy = 415;
  const radii = [105, 195, 290, 385];
  const labels = ['VERSE', 'PASSAGE', 'BOOK', 'BIBLE'];
  const midAngle = -45 * (Math.PI / 180);

  function getArcD(r) {
    const sx = cx + r;
    const sy = cy;
    const ex = cx;
    const ey = cy - r;
    return `M ${sx} ${sy} A ${r} ${r} 0 0 0 ${ex} ${ey}`;
  }

  let arcsHTML = '';
  radii.forEach((r, i) => {
    const active = i === activeIdx;
    const baseOpacity = active ? 1 : Math.max(0.12, 0.45 - (i * 0.09));
    if (active) {
      arcsHTML += `<path class="arc-active" d="${getArcD(r)}" fill="none"
        stroke="var(--ink)"
        stroke-width="9.5"
        opacity="1"
        mask="url(#arcTrailMask)" />`;
    }
    arcsHTML += `<path class="${active ? 'arc-active' : 'arc-dim'}" d="${getArcD(r)}" fill="none" 
      stroke="${active ? 'var(--lime)' : 'rgba(255,255,255,0.32)'}" 
      stroke-width="${active ? 5.5 : 2}" 
      opacity="${baseOpacity}" 
      mask="url(#arcTrailMask)"
      style="transition: all .35s cubic-bezier(.2,.8,.25,1);" />`;
  });

  let badgesHTML = '';
  radii.forEach((r, i) => {
    const active = i === activeIdx;
    const lx = cx + r * Math.cos(midAngle);
    const ly = cy + r * Math.sin(midAngle);

    if (active) {
      badgesHTML += `
        <g class="badge-active">
          <rect x="${lx - 46 + 4}" y="${ly - 16 + 4}" width="92" height="32" rx="16" fill="var(--ink)" />
          <rect x="${lx - 46}" y="${ly - 16}" width="92" height="32" rx="16" fill="var(--lime)" stroke="#0D0D0D" stroke-width="3.5" />
          <text x="${lx}" y="${ly + 4.5}" fill="#0D0D0D" font-family="'Space Grotesk',sans-serif" font-weight="900" font-size="13px" text-anchor="middle" letter-spacing="1.2px">${labels[i]}</text>
        </g>
      `;
    } else {
      const textOp = Math.max(0.25, 0.5 - (i * 0.08));
      badgesHTML += `<text x="${lx + 6}" y="${ly - 6}" fill="rgba(255,255,255,${textOp})" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="11px" letter-spacing="1px">${labels[i]}</text>`;
    }
  });

  const centerNode = `<circle cx="${cx}" cy="${cy}" r="8" fill="var(--lime)" stroke="var(--ink)" stroke-width="2.5" />`;

  return `
    <svg viewBox="0 0 400 430" width="100%" height="100%" preserveAspectRatio="xMinYMax meet" style="overflow:visible;">
      <defs>
        <linearGradient id="edgeFadeGrad" x1="0%" y1="100%" x2="80%" y2="20%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
          <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35" />
        </linearGradient>
        <mask id="arcTrailMask">
          <rect x="-10" y="-10" width="430" height="460" fill="url(#edgeFadeGrad)" />
        </mask>
      </defs>
      ${arcsHTML}${badgesHTML}${centerNode}
    </svg>
  `;
}

function initNotches(){
  const layer = document.getElementById('notchesLayer');
  layer.innerHTML = '';
  const total = beats.length;
  beats.forEach((b, i) => {
    if (b.isInteractive) {
      const notch = document.createElement('div');
      notch.className = 'prog-notch';
      notch.id = `notch-${i}`;
      const pct = (i / (total - 1)) * 100;
      notch.style.left = `${pct}%`;
      layer.appendChild(notch);
    }
  });
}

function updateProgressBar(){
  const fill = document.getElementById('progressBarFill');
  const total = beats.length;
  const pct = (state.index / (total - 1)) * 100;
  fill.style.width = `${pct}%`;

  beats.forEach((b, i) => {
    if (b.isInteractive) {
      const notch = document.getElementById(`notch-${i}`);
      if (!notch) return;
      notch.classList.remove('passed', 'active');
      if (state.index > i) {
        notch.classList.add('passed');
      } else if (state.index === i) {
        notch.classList.add('active');
      }
    }
  });
}

const stage = document.getElementById('stage');
const phoneEl = document.getElementById('phone');
beats.forEach((b,i)=>{
  const div=document.createElement('div');
  div.className = `beat ${b.text === 'light' ? 'tx-light' : 'tx-dark'}`;
  div.id = `beat-${i}`;
  div.style.background = b.bgGrad;
  div.innerHTML = b.html;
  stage.appendChild(div);
});

let clueTimeout = null;

function triggerSelectionClue(){
  const b = beats[state.index];
  
  if (b.id === 'vocab-scan') {
    const pill = document.getElementById('vocabPill');
    const txt = document.getElementById('vocabPillText');
    if (pill && txt) {
      pill.classList.add('warn');
      txt.textContent = state.wordTaps.length === 0 ? 'Flag a word to continue!' : 'Scroll to the bottom!';
      setTimeout(() => { pill.classList.remove('warn'); updateWordUI(); }, 1800);
      return;
    }
  }

  if (b.id === 'char-verse-pick') {
    const pill = document.getElementById('charPill');
    const txt = document.getElementById('charPillText');
    if (pill && txt) {
      pill.classList.add('warn');
      txt.textContent = 'Tap a verse to select!';
      setTimeout(() => { pill.classList.remove('warn'); updateCharPill(); }, 1800);
      return;
    }
  }

  const activeBeatEl = document.getElementById(`beat-${state.index}`);
  const hintBox = activeBeatEl ? activeBeatEl.querySelector('.tap-hint') : null;
  if (!hintBox) return;

  const clueText = b.clue || 'Make a selection';
  hintBox.innerHTML = `<span class="clue-badge"><i class="fa-solid fa-hand-pointer"></i> ${clueText}</span>`;

  clearTimeout(clueTimeout);
  clueTimeout = setTimeout(() => {
    resetArrows();
  }, 2000);
}

function resetArrows(){
  const activeBeatEl = document.getElementById(`beat-${state.index}`);
  const hintBox = activeBeatEl ? activeBeatEl.querySelector('.tap-hint') : null;
  if (!hintBox) return;

  if (state.index === 0) {
    hintBox.innerHTML = `<div class="swipe-hint"><i class="fa-solid fa-chevron-left"></i><i class="fa-solid fa-chevron-right"></i></div>
    <div class="nav-subtle-caption">Swipe to navigate</div>`;
  } else {
    hintBox.innerHTML = `<div class="swipe-hint"><i class="fa-solid fa-chevron-left"></i><i class="fa-solid fa-chevron-right"></i></div>`;
  }
}

function renderBeat(i){
  document.querySelectorAll('.beat').forEach(el=>el.classList.remove('active'));
  document.getElementById(`beat-${i}`).classList.add('active');
  renderGen++;
  stopGhostCycle();
  stopZoomCycle();
  const b = beats[i];

  phoneEl.style.background = b.bgGrad;
  document.querySelector('.hud-header').className = 'hud-header ' + (b.text === 'light' ? 'tx-light' : 'tx-dark');
  document.getElementById('sectionLabel').textContent = sectionLabels[i] || '';

  resetArrows();

  if (b.id === 'char-coaching') {
    const activeVerse = state.charVerse || 21;
    document.getElementById('charRef').textContent = 'Mark 1:' + activeVerse;
    document.getElementById('charText').textContent = quoteVerse(passage[activeVerse-21]);

    const arcStem = document.getElementById('arcStemText');
    if (arcStem) arcStem.textContent = `BASED ON VERSE ${activeVerse}:`;

    const coachText = document.getElementById('coachBoxText');
    if (coachText) coachText.innerHTML = `<b>TIP:</b> Have students look down at verse ${activeVerse} and share what they think it reveals about God's character. Silence is okay, give it 7 seconds before jumping in.`;

    const inp = document.getElementById('customTraitInput');
    if (inp) {
      if (state.trait && state.trait.trim()) {
        inp.value = state.trait;
        inp.classList.remove('ghost');
        stopGhostCycle();
      } else {
        inp.value = 'e.g. ' + ghostExamples[0];
        inp.classList.add('ghost');
        startGhostCycle();
      }
    }
    document.getElementById('coachBox').classList.toggle('show', !!(state.trait && state.trait.trim()));
  } else if (b.id === 'char-verse-pick') {
    document.querySelectorAll('#beat-'+i+' .verse-tile').forEach(t=>t.classList.toggle('selected', state.charVerse !== null && Number(t.dataset.v)===state.charVerse));
    updateCharPill();
  } else if (b.id === 'vocab-scan') {
    updateWordUI();
    checkPassageScroll();
  }

  if (b.id === 'final') fillFinal();
  if (b.id === 'vocab-review') renderVocabReview();

  updateProgressBar();
}

const answeredBeats = new Set();

function questAnswer(e, el, gridId){
  e.stopPropagation();
  if (el.classList.contains('locked')) return;
  const isCorrect = el.dataset.correct === 'true';
  if (isCorrect) {
    const grid = document.getElementById(gridId);
    grid.querySelectorAll('.quiz-tile').forEach(t=>t.classList.add('locked'));
    el.classList.add('correct');
    answeredBeats.add(state.index);
    const myGen = renderGen;
    setTimeout(()=>{ if (renderGen === myGen) goNext(); }, 600);
  } else {
    el.classList.add('incorrect','shake');
    setTimeout(()=>{ el.classList.remove('shake','incorrect'); }, 500);
  }
}

function tapWord(e, el){
  e.stopPropagation();
  const key = el.dataset.word;
  if (!key) return;
  const word = el.textContent.trim().replace(/^[^A-Za-z']+/, '').replace(/[^A-Za-z']+$/, '');
  const already = el.classList.contains('flagged');
  if (already) {
    el.classList.remove('flagged');
    state.wordTaps = state.wordTaps.filter(w => w.el !== el);
  } else {
    const def = defs[key] || null;
    el.classList.add('flagged');
    state.wordTaps.push({ el, word, def });
  }
  updateWordUI();
}

function updateWordUI(){ checkVocabComplete(); }

function checkVocabComplete(){
  const pill = document.getElementById('vocabPill');
  const textEl = document.getElementById('vocabPillText');
  if (!pill || !textEl) return;
  const hasWord = state.wordTaps.length > 0;
  const ready = hasWord && state.scrolledToEnd;
  pill.classList.toggle('ready', ready);
  if (ready) {
    textEl.innerHTML = '<i class="fa-solid fa-check"></i> Continue';
  } else {
    const n = state.wordTaps.length;
    textEl.textContent = n > 0 ? `${n} word${n===1?'':'s'} flagged` : 'Flag Key Words';
  }
}

function tryAdvanceVocab(){
  if (state.wordTaps.length > 0 && state.scrolledToEnd) goNext();
  else triggerSelectionClue();
}

function checkPassageScroll(){
  const el = document.getElementById('passageScrollEl');
  const hint = document.getElementById('scrollMoreHint');
  if (!el) return;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
  if (atBottom && !state.scrolledToEnd) {
    state.scrolledToEnd = true;
    checkVocabComplete();
  }
  if (hint) hint.classList.toggle('hide', atBottom);
}

function renderVocabReview(){
  const box = document.getElementById('vocabReviewBox');
  if (state.wordTaps.length === 0) {
    box.innerHTML = `<div class="review-card">No words flagged!</div>`;
    return;
  }
  const defined = state.wordTaps.filter(w => w.def);
  const undefinedWords = state.wordTaps.filter(w => !w.def);
  
  let html = '';
  if (defined.length > 0) {
    html += `<div class="review-section-header"><i class="fa-solid fa-book-bookmark"></i> Defined Terms</div>`;
    html += defined.map(w => `<div class="review-card"><b>${w.word}:</b> ${w.def}</div>`).join('');
  }
  if (undefinedWords.length > 0) {
    html += `<div class="review-section-header"><i class="fa-solid fa-magnifying-glass"></i> Terms to Define Before Sunday</div>
             <div class="pill-cloud">${undefinedWords.map(w => `<div class="research-pill">${w.word}</div>`).join('')}</div>`;
  }
  box.innerHTML = html;
}

function pickCharVerse(e, v){
  e.stopPropagation();
  state.charVerse = v;
  document.querySelectorAll('.verse-tile').forEach(t=>t.classList.toggle('selected', Number(t.dataset.v)===v));
  updateCharPill();
}

function updateCharPill(){
  const pill = document.getElementById('charPill');
  const textEl = document.getElementById('charPillText');
  if (!pill || !textEl) return;
  const ready = state.charVerse !== null;
  pill.classList.toggle('ready', ready);
  if (ready) {
    textEl.innerHTML = '<i class="fa-solid fa-check"></i> Continue';
  } else {
    textEl.textContent = "Spot a God Shot";
  }
}

function tryAdvanceChar(){
  if (state.charVerse !== null) goNext();
  else triggerSelectionClue();
}

const ghostExamples = ['Holy', 'Love', 'King'];
let ghostCycleTimer = null;
let ghostCycleIndex = 0;

function startGhostCycle(){
  stopGhostCycle();
  ghostCycleIndex = 0;
  const myGen = renderGen;
  ghostCycleTimer = setInterval(()=>{
    if (renderGen !== myGen) { stopGhostCycle(); return; }
    const inp = document.getElementById('customTraitInput');
    if (!inp || !inp.classList.contains('ghost')) { stopGhostCycle(); return; }
    ghostCycleIndex = (ghostCycleIndex + 1) % ghostExamples.length;
    inp.value = 'e.g. ' + ghostExamples[ghostCycleIndex];
  }, 2200);
}

function stopGhostCycle(){
  if (ghostCycleTimer) { clearInterval(ghostCycleTimer); ghostCycleTimer = null; }
}

/* Ambient auto-cycling ring highlight for the consolidated expand-zoom beat —
   ring highlight advances on its own so the whole verse->passage->book->bible
   idea plays out on one slide instead of needing 4 swipes to see it. */
let zoomCycleTimer = null;
let zoomCycleIndex = 0;

function startZoomCycle(){
  stopZoomCycle();
  zoomCycleIndex = 0;
  const myGen = renderGen;
  zoomCycleTimer = setInterval(()=>{
    if (renderGen !== myGen) { stopZoomCycle(); return; }
    const el = document.getElementById('zoomGraphic');
    if (!el) { stopZoomCycle(); return; }
    zoomCycleIndex = (zoomCycleIndex + 1) % 4;
    el.innerHTML = zoomRings(zoomCycleIndex);
  }, 1800);
}

function stopZoomCycle(){
  if (zoomCycleTimer) { clearInterval(zoomCycleTimer); zoomCycleTimer = null; }
}

function handleBlankFocus(inp){
  if (inp.classList.contains('ghost')) {
    inp.value = '';
    inp.classList.remove('ghost');
    stopGhostCycle();
  }
}

function handleCustomTrait(val){
  state.trait = val;
  const box = document.getElementById('coachBox');
  const hasContent = !!(val && val.trim());
  if (box) box.classList.toggle('show', hasContent);
}

function fillFinal(){
  const list = document.getElementById('finalWords');
  if (state.wordTaps.length === 0) {
    list.innerHTML = `<div class="word-chip">No words flagged.</div>`;
  } else {
    const limitedTaps = state.wordTaps.slice(0, 3);
    list.innerHTML = limitedTaps.map(w=>{
      const d = w.def || 'Look up definition before group.';
      return `<div class="word-chip"><b>${w.word}</b> — ${d}</div>`;
    }).join('');
  }
  
  const fv = document.getElementById('finalVerse');
  if (state.charVerse) {
    fv.innerHTML = `<b>Mark 1:${state.charVerse}</b> — ${quoteVerse(passage[state.charVerse-21])}`;
  } else {
    fv.textContent = 'No verse selected.';
  }
  
  const trait = state.trait && state.trait.trim() ? state.trait.trim() : 'Holy';
  const appStmt = document.getElementById('finalAppStatement');
  if (appStmt) {
    appStmt.innerHTML = `God is <b>${trait}</b>. Therefore, I ________.`;
  }
}

function goNext(){
  const b = beats[state.index];
  if (b.blockTap) {
    if ((b.id === 'quest-testament' || b.id === 'quest-section') && !answeredBeats.has(state.index)) {
      triggerSelectionClue();
      return;
    }
    if (b.id === 'vocab-scan' && (!state.wordTaps.length || !state.scrolledToEnd)) {
      triggerSelectionClue();
      return;
    }
    if (b.id === 'char-verse-pick' && state.charVerse === null) {
      triggerSelectionClue();
      return;
    }
    if (b.id === 'char-coaching' && !(state.trait && state.trait.trim())) {
      triggerSelectionClue();
      return;
    }
  }
  if (state.index < beats.length - 1) {
    const nextBeat = beats[state.index + 1];
    const isFlipPair = (b.id === 'reading-intro' && nextBeat.id === 'vocab-scan') ||
                        (b.id === 'character-prompt' && nextBeat.id === 'char-verse-pick');
    if (isFlipPair) {
      const curEl = document.getElementById('beat-' + state.index);
      if (curEl) {
        curEl.classList.add('page-flip-out');
        setTimeout(()=>{ curEl.classList.remove('page-flip-out'); }, 650);
      }
    }
    state.index++; renderBeat(state.index);
  }
}

function goPrev(){ if (state.index > 0) { state.index--; renderBeat(state.index); } }

/* KEYBOARD NAVIGATION */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
});

/* SWIPE + TAP-ZONE NAVIGATION (Instagram/Snapchat-style: tap left/right to step, swipe still works) */
const NAV_EXCLUDE = '.quiz-tile, .verse-tile, .w, .w-plain, .flow-para, .focus-pill-dock, button, input, textarea, a, .breath-visual';
let lastGestureTime = 0;

function tapZoneNav(clientX){
  const rect = stageEl.getBoundingClientRect();
  const relX = clientX - rect.left;
  if (relX < rect.width * 0.32) goPrev();
  else goNext();
}

let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
const stageEl = document.getElementById('stage');

stageEl.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
}, { passive: true });

stageEl.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;

  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 500) {
    lastGestureTime = Date.now();
    if (dx < 0) goNext();
    else goPrev();
  } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 400) {
    if (e.target.closest(NAV_EXCLUDE)) return;
    lastGestureTime = Date.now();
    tapZoneNav(t.clientX);
  }
}, { passive: true });

let mouseStartX = 0, mouseStartY = 0, mouseIsDown = false, mouseDidDrag = false;

stageEl.addEventListener('mousedown', (e) => {
  if (['INPUT', 'BUTTON', 'TEXTAREA'].includes(e.target.tagName) || e.target.closest(NAV_EXCLUDE)) return;
  mouseIsDown = true;
  mouseDidDrag = false;
  mouseStartX = e.clientX;
  mouseStartY = e.clientY;
});

stageEl.addEventListener('mouseup', (e) => {
  if (!mouseIsDown) return;
  mouseIsDown = false;
  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;

  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    mouseDidDrag = true;
    lastGestureTime = Date.now();
    if (dx < 0) goNext();
    else goPrev();
  } else if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
    mouseDidDrag = true; // small-but-real drag: don't also treat the trailing click as a tap
  }
});

/* Click = tap-zone advance (mirrors Instagram/Snapchat: tap left third to go back, right to go forward) */
stageEl.addEventListener('click', (e) => {
  if (mouseDidDrag) { mouseDidDrag = false; return; }
  if (Date.now() - lastGestureTime < 500) return; // ignore the synthetic click a touch tap already handled
  if (e.target.closest(NAV_EXCLUDE)) return;
  tapZoneNav(e.clientX);
});

      <div style="font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:#A855F7; margin:20px 0 8px 0;">A — Application</div>
      <div style="font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; line-height:1.5; margin-bottom:8px;">God is <b style="color:#F43F5E; text-transform:capitalize;">${trait}</b>. Therefore, I ________.</div>
      <div style="font-family:'Inter',sans-serif; font-weight:700; font-size:11.5px; line-height:1.45; background:rgba(168,85,247,0.1); border:2px dashed #A855F7; border-radius:12px; padding:10px 12px; color:#0D0D0D;">Take this into your personal journal before Sunday: In light of who God is in Mark 1, how is He calling you to respond?</div>

      <div style="font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:#A855F7; margin:20px 0 8px 0;">R — Reflection</div>
      <div style="font-family:'Inter',sans-serif; font-weight:700; font-size:11.5px; line-height:1.45; background:rgba(168,85,247,0.1); border:2px dashed #A855F7; border-radius:12px; padding:11px 13px; color:#0D0D0D;">Read Mark 1:1–20 in your own Bible before Sunday. Reflect on his character in prayer.</div>
    </div>`;

  try{
    const canvas = await html2canvas(target.firstElementChild, { scale: 2, backgroundColor: null, useCORS: true });
    canvas.toBlob(async (blob) => {
      if (!blob) { alert('Export failed. Please take a screenshot instead.'); return; }
      const file = new File([blob], 'MS_Hang_SOAR_Guide.png', { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'MS Hang SOAR Guide' });
          return;
        } catch (shareErr) {
          if (shareErr && shareErr.name === 'AbortError') return;
        }
      }

      try {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = 'MS_Hang_SOAR_Guide.png';
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch (downloadErr) {
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }
    }, 'image/png');
  } catch(err){ alert('Export failed. Please take a screenshot instead.'); }
}

const passageScrollElInit = document.getElementById('passageScrollEl');
if (passageScrollElInit) passageScrollElInit.addEventListener('scroll', checkPassageScroll, { passive: true });

initNotches();
renderBeat(0);
</script>

<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dwell | Building blocks for Biblical literacy</title>
<meta name="description" content="Let the word of Christ dwell in you richly. Colossians 3:16">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<!-- The Dwell Study journal cover, as the homepage. The previous homepage lives at /home-original. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #111; }
  body { min-height: 100svh; display: flex; flex-direction: column; font-family: 'DM Sans', sans-serif; }

  /* ---------- header: DWELL | STUDY mark + menu (same on every page) ---------- */
  .top { position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 20px; flex: none; }
  .logo { display: flex; align-items: center; gap: 3px; height: 38px; color: #111; text-decoration: none; }
  .logo .side { position: relative; width: 9px; height: 100%; flex: none; }
  .logo .side span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap;
                     font: 700 9px/1 'DM Sans', sans-serif; letter-spacing: 1.4px; padding-left: 1.4px; text-transform: uppercase; }
  .logo .box { height: 100%; display: flex; align-items: center; background: #111; color: #fff; border-radius: 4px; padding: 2px 10px 0;
               font: 700 25px/1 'Fraunces', serif; letter-spacing: .5px; }
  .menu-btn { width: 44px; height: 44px; display: grid; place-content: center; gap: 5px; background: none; border: 0; cursor: pointer; padding: 0; }
  .menu-btn i { display: block; width: 24px; height: 2px; background: #111; border-radius: 2px; transition: transform .2s, opacity .2s; }
  .menu-btn[aria-expanded="true"] i:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .menu-btn[aria-expanded="true"] i:nth-child(2) { opacity: 0; }
  .menu-btn[aria-expanded="true"] i:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .menu { position: absolute; top: 62px; right: 20px; width: 240px; background: #fff; border: 1.5px solid #111; border-radius: 6px; padding: 6px; display: none; }
  .menu.open { display: block; }
  .menu a { display: block; padding: 12px 14px; border-radius: 4px; color: #111; text-decoration: none; }
  .menu a:hover, .menu a:focus-visible { background: #f1f2f4; outline: none; }
  .menu b { display: block; font: 700 19px/1.1 'Fraunces', serif; }
  .menu small { display: block; margin-top: 3px; font-size: 13px; color: #5b6878; }

  /* ---------- the cover: the book's layout, scaled to fit the screen ---------- */
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 20px; }
  /* frame = the four windows + circle with a 20pt margin, measured in the book's points (396 wide) */
  .cover { width: min(100vw, (100svh - 92px) * 396 / 561); aspect-ratio: 396 / 561; position: relative; container-type: inline-size; --u: calc(100cqw / 396); }
  .win { position: absolute; width: calc(174 * var(--u)); height: calc(256.5 * var(--u)); border-radius: calc(6 * var(--u));
         background: #2c3b3f url(dwell-cover.jpg) no-repeat; background-size: calc(396 * var(--u)) calc(612 * var(--u)); }
  /* each window shows the part of the photo behind it, exactly as on the printed cover */
  .tl { left: calc(20 * var(--u));  top: calc(20 * var(--u));    background-position: calc(-20 * var(--u))  calc(-45.5 * var(--u)); }
  .tr { left: calc(202 * var(--u)); top: calc(20 * var(--u));    background-position: calc(-202 * var(--u)) calc(-45.5 * var(--u)); }
  .bl { left: calc(20 * var(--u));  top: calc(284.5 * var(--u)); background-position: calc(-20 * var(--u))  calc(-310 * var(--u)); }
  .br { left: calc(202 * var(--u)); top: calc(284.5 * var(--u)); background-position: calc(-202 * var(--u)) calc(-310 * var(--u)); }
  .truth { position: absolute; left: calc(106 * var(--u)); top: calc(188.5 * var(--u)); width: calc(184 * var(--u)); height: calc(184 * var(--u));
           border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: calc(6 * var(--u)); text-align: center; margin: 0; }
  .truth span { font-style: italic; font-size: calc(15 * var(--u)); line-height: 1; white-space: nowrap; }
  .truth b { font-weight: 700; }
  .truth cite { margin-top: calc(6 * var(--u)); font: normal 600 calc(8 * var(--u))/1 'Fraunces', serif;
                letter-spacing: calc(2 * var(--u)); padding-left: calc(2 * var(--u)); text-transform: uppercase; color: #4a5568; }
</style></head>
<body>
  <header class="top">
    <a class="logo" href="/" aria-label="Dwell Study home"><span class="side"><span>Dwell</span></span><span class="box">STUDY</span></a>
    <button class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
    <nav class="menu" id="menu">
      <a href="/bookmark"><b>Bookmark</b><small>The five steps and prayers</small></a>
      <a href="/guidedsoar"><b>Guided SOAR</b><small>Templates and leader guide</small></a>
    </nav>
  </header>

  <main class="stage">
    <div class="cover">
      <div class="win tl" aria-hidden="true"></div>
      <div class="win tr" aria-hidden="true"></div>
      <div class="win bl" aria-hidden="true"></div>
      <div class="win br" aria-hidden="true"></div>
      <blockquote class="truth">
        <span>Let the word</span>
        <span>of Christ <b>dwell</b></span>
        <span>in you richly.</span>
        <cite>Colossians 3:16</cite>
      </blockquote>
    </div>
  </main>

  <script>
    (function () {
      var btn = document.querySelector('.menu-btn'), menu = document.getElementById('menu');
      function set(open) { btn.setAttribute('aria-expanded', open); menu.classList.toggle('open', open); }
      btn.addEventListener('click', function (e) { e.stopPropagation(); set(!menu.classList.contains('open')); });
      document.addEventListener('click', function (e) { if (!menu.contains(e.target)) set(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
    })();
  </script>
</body>
</html>

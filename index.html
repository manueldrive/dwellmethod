<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dwell | Building blocks for Biblical literacy</title>
<meta name="description" content="Let the word of Christ dwell in you richly. Colossians 3:16">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<!-- The Dwell Study journal cover, as the homepage. The previous homepage lives at /home-original. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100svh; }

  /* the cover is laid out on the book's 396 x 612 pt page and scaled to fit the screen */
  .cover { width: min(100vw, 100svh * 396 / 612); aspect-ratio: 396 / 612; position: relative; container-type: inline-size; }
  .cover { --u: calc(100cqw / 396); }

  /* four windows onto one photo, lined up so they read as a single picture */
  .win { position: absolute; width: calc(174 * var(--u)); height: calc(256.5 * var(--u)); border-radius: calc(6 * var(--u)); overflow: hidden;
         background: #2c3b3f url(dwell-cover.jpg) no-repeat; background-size: calc(396 * var(--u)) calc(612 * var(--u)); }
  .tl { left: calc(20 * var(--u));  top: calc(45.5 * var(--u)); background-position: calc(-20 * var(--u))  calc(-45.5 * var(--u)); }
  .tr { left: calc(202 * var(--u)); top: calc(45.5 * var(--u)); background-position: calc(-202 * var(--u)) calc(-45.5 * var(--u)); }
  .bl { left: calc(20 * var(--u));  top: calc(310 * var(--u));  background-position: calc(-20 * var(--u))  calc(-310 * var(--u)); }
  .br { left: calc(202 * var(--u)); top: calc(310 * var(--u));  background-position: calc(-202 * var(--u)) calc(-310 * var(--u)); }

  /* the verse sits where the central truth sits on every study page */
  .truth { position: absolute; left: calc(106 * var(--u)); top: calc(214 * var(--u)); width: calc(184 * var(--u)); height: calc(184 * var(--u));
           border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: calc(6 * var(--u)); text-align: center; color: #111; margin: 0; }
  .truth span { font-family: 'DM Sans', sans-serif; font-style: italic; font-size: calc(15 * var(--u)); line-height: 1; white-space: nowrap; }
  .truth b { font-weight: 700; }
  .truth cite { margin-top: calc(6 * var(--u)); font-family: 'Fraunces', serif; font-style: normal; font-weight: 600; font-size: calc(8 * var(--u));
                letter-spacing: calc(2 * var(--u)); padding-left: calc(2 * var(--u)); text-transform: uppercase; color: #4a5568; line-height: 1; }

  /* DWELL | STUDY mark in the dark lower-right window */
  .mark { position: absolute; right: calc(13 * var(--u)); bottom: calc(13 * var(--u)); display: flex; align-items: flex-end; gap: calc(3 * var(--u)); color: #fff; margin: 0; font-weight: 700; }
  .mark .side { position: relative; width: calc(7 * var(--u)); height: calc(20.5 * var(--u)); flex: none; }
  .mark .side span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap;
                     font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: calc(5.5 * var(--u)); letter-spacing: calc(0.9 * var(--u)); padding-left: calc(0.9 * var(--u)); text-transform: uppercase; line-height: 1; }
  .mark .word { font-family: 'Fraunces', serif; font-weight: 700; font-size: calc(28 * var(--u)); line-height: 0.74; letter-spacing: calc(0.5 * var(--u)); }
</style></head>
<body>
  <main class="cover">
    <div class="win tl" aria-hidden="true"></div>
    <div class="win tr" aria-hidden="true"></div>
    <div class="win bl" aria-hidden="true"></div>
    <div class="win br" aria-hidden="true">
      <h1 class="mark" aria-label="Dwell Study"><span class="side"><span>Dwell</span></span><span class="word">STUDY</span></h1>
    </div>
    <blockquote class="truth">
      <span>Let the word</span>
      <span>of Christ <b>dwell</b></span>
      <span>in you richly.</span>
      <cite>Colossians 3:16</cite>
    </blockquote>
  </main>
</body>
</html>

<!-- Homepage while the Dwell ideas are tabled: the verse, plus cards for Guided SOAR, Central Truth, and the Dwell Bookmark (coming soon).
     The previous homepage lives at /home-dwell. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #fff; color: #111; }
  body { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; padding: 48px 20px; font-family: 'DM Sans', sans-serif; }

  /* logo lockup: the book-and-mountain mark with the logo's text set live */
  .brand { margin: 0; display: flex; flex-direction: column; align-items: center; text-align: center; color: #111; }
  .brand img { width: clamp(96px, 26vw, 132px); height: auto; display: block; }
  .brand .domain { margin: 0; padding-left: .32em; font: 400 clamp(17px, 4.6vw, 26px)/1 'Jost', sans-serif; letter-spacing: .32em; }
  .brand .tag { margin: 12px 0 0; padding-left: .3em; font: 300 clamp(11px, 3vw, 15px)/1.4 'Jost', sans-serif; letter-spacing: .3em; color: #767676; }

  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: min(100%, 640px); }
  .card .mark svg { height: 34px; width: auto; display: block; overflow: visible; }
  @media (max-width: 860px) and (min-width: 561px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); width: min(100%, 640px); } }
  .card { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 22px 22px 20px; border: 1.5px solid #111; border-radius: 6px; background: #fff; color: #111; text-decoration: none; min-height: 180px; }
  .card .mark { height: 40px; display: flex; align-items: center; }
  .card .mark img { height: 40px; width: auto; display: block; }
  .card hr { width: 100%; margin: 0; border: 0; border-top: 1.5px solid #111; opacity: .15; }
  .card h2 { margin: 0; font: 700 22px/1.15 'Fraunces', serif; }
  .card p { margin: 0; font-size: 14.5px; line-height: 1.45; color: #3d4450; }
  .card .go { margin-top: auto; font: 700 13px/1 'DM Sans', sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  a.card { transition: background .2s, transform .2s; }
  a.card:hover { background: #f6f7f8; }
  a.card:hover .go { text-decoration: underline; text-underline-offset: 4px; }
  a.card:focus-visible { outline: 2px solid #111; outline-offset: 3px; }

  /* the bookmark isn't ready yet: same card, dashed and quiet, not a link */
  .card.soon { border-style: dashed; border-color: #a3abb6; color: #6b7480; cursor: default; }
  .card.soon h2 { color: #4a5260; }
  .card.soon p { color: #6b7480; }
  .card.soon .go { color: #8a929c; }
  .logo { display: flex; align-items: center; gap: 3px; height: 38px; }
  .logo .side { position: relative; width: 9px; height: 100%; flex: none; }
  .logo .side span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap; font: 700 8px/1 'DM Sans', sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  .logo .box { height: 100%; display: flex; align-items: center; background: #111; color: #fff; border-radius: 4px; padding: 2px 10px 0; font: 700 20px/1 'DM Sans', sans-serif; letter-spacing: .02em; }

  @media (max-width: 560px) {
    body { gap: 40px; }
    .cards { grid-template-columns: minmax(0, 1fr); }
    .card { min-height: 0; }
  }
  .site-foot { text-align: center; padding: 8px 20px 28px; }
  .site-foot a { font: 400 12px/1 'DM Sans', sans-serif; letter-spacing: .06em; color: #111; opacity: .35; text-decoration: none; }
  .site-foot a:hover { opacity: .6; }
</style></head>

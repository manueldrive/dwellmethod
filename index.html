<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dwell | Building blocks for Biblical literacy</title>
<meta name="description" content="Let the word of Christ dwell in you richly. Colossians 3:16">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<!-- The Dwell Study journal cover, as the homepage. The previous homepage lives at /home-original. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #111; }
  body { min-height: 100svh; display: flex; flex-direction: column; font-family: 'DM Sans', sans-serif; }

  /* ---------- the cover: the book's layout, scaled to fit the screen ---------- */
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 20px; }
  /* frame = the four windows + circle with a 20pt margin, measured in the book's points (396 wide) */
  .cover { width: min(100vw, (100svh - 92px) * 396 / 561); aspect-ratio: 396 / 561; position: relative; container-type: inline-size; --u: calc(100cqw / 396); }
  .win { position: absolute; width: calc(174 * var(--u)); height: calc(256.5 * var(--u)); border-radius: calc(6 * var(--u));
         background: #2c3b3f url(dwell-cover.jpg) no-repeat; background-size: calc(396 * var(--u)) calc(612 * var(--u)); }
  /* each window shows the part of the photo behind it, exactly as on the printed cover */
  .tl { left: calc(20 * var(--u));  top: calc(20 * var(--u));    background-position: calc(-20 * var(--u))  calc(-45.5 * var(--u)); }
  .tr { left: calc(202 * var(--u)); top: calc(20 * var(--u));    background-position: calc(-202 * var(--u)) calc(-45.5 * var(--u)); }
  .bl { left: calc(20 * var(--u));  top: calc(284.5 * var(--u)); background-position: calc(-20 * var(--u))  calc(-310 * var(--u)); }
  .br { left: calc(202 * var(--u)); top: calc(284.5 * var(--u)); background-position: calc(-202 * var(--u)) calc(-310 * var(--u)); }
  .truth { position: absolute; left: calc(106 * var(--u)); top: calc(188.5 * var(--u)); width: calc(184 * var(--u)); height: calc(184 * var(--u));
           border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: calc(6 * var(--u)); text-align: center; margin: 0; }
  .truth span { font-style: italic; font-size: calc(15 * var(--u)); line-height: 1; white-space: nowrap; }
  .truth b { font-weight: 700; }
  .truth cite { margin-top: calc(6 * var(--u)); font: normal 600 calc(8 * var(--u))/1 'Fraunces', serif;
                letter-spacing: calc(2 * var(--u)); padding-left: calc(2 * var(--u)); text-transform: uppercase; color: #4a5568; }
</style></head>
<body>
  <header class="top">
    <a class="logo" href="/" aria-label="Dwell Study home"><span class="side"><span>Dwell</span></span><span class="box">STUDY</span></a>
    <button class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
    <nav class="menu" id="menu">
      <a href="/bookmark"><b>Bookmark</b><small>The five steps and prayers</small></a>
      <a href="/guideddwell"><b>Guided Dwell</b><small>The four-corner study card</small></a>
      <a href="/resources"><b>Resources</b><small>Videos and study tools</small></a>
      <a href="/about"><b>About</b><small>What Dwell is and why</small></a>
    </nav>
  </header>

  <main class="stage">
    <div class="cover">
      <div class="win tl" style="view-transition-name: win-tl" aria-hidden="true"></div>
      <div class="win tr" style="view-transition-name: win-tr" aria-hidden="true"></div>
      <div class="win bl" style="view-transition-name: win-bl" aria-hidden="true"></div>
      <div class="win br" style="view-transition-name: win-br" aria-hidden="true"></div>
      <blockquote class="truth" style="view-transition-name: truth">
        <span>Let the word</span>
        <span>of Christ <b>dwell</b></span>
        <span>in you richly.</span>
        <cite>Colossians 3:16</cite>
      </blockquote>
    </div>
  </main>

  <script src="/site.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MS Hang Prep — Mark 1:21–45</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --paper:#FFFFFF;
    --cream:#EAE6DF;
    --lime:#C3F53C;
    --pink:#F43F5E;
    --blue:#38BDF8;
    --yellow:#FFC72C;
    --purple:#A855F7;
    --green:#22C55E;

    --bg-lime: linear-gradient(145deg, #d2f860 0%, #a2e014 100%);
    --bg-purple: linear-gradient(145deg, #b862f8 0%, #7e22ce 100%);
    --bg-pink: linear-gradient(145deg, #fb5672 0%, #be123c 100%);
    --bg-dark: linear-gradient(145deg, #262626 0%, #050505 100%);
    --bg-cream: linear-gradient(145deg, #f4f0e8 0%, #d8d2c7 100%);
    --bg-yellow: linear-gradient(145deg, #ffd452 0%, #eab308 100%);
    --bg-teal: linear-gradient(145deg, #49737d 0%, #1f424b 100%);
    --bg-terracotta: linear-gradient(145deg, #e48d75 0%, #a15844 100%);
    --bg-sage: linear-gradient(145deg, #729e8f 0%, #42665a 100%);
    --bg-orange: linear-gradient(145deg, #f6af77 0%, #b07546 100%);
    --bg-leather: linear-gradient(160deg, #7a4a2c 0%, #452817 100%);
  }
  *{box-sizing:border-box;}
  
  html, body { 
    margin:0; 
    padding:0; 
    width:100%; 
    height:100%; 
    background:var(--ink); 
    font-family:'Inter', sans-serif; 
    -webkit-tap-highlight-color: transparent; 
    overscroll-behavior:none; 
    overflow:hidden;
  }

  .app-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: var(--bg-cream);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background .4s ease;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* FULLSCREEN BUTTON (DESKTOP ONLY) */
  .fs-toggle-btn {
    position: absolute;
    top: 14px;
    right: 18px;
    z-index: 100;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(13, 13, 13, 0.12);
    border: 1.5px solid rgba(13, 13, 13, 0.2);
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }
  @media (max-width: 767px) {
    .fs-toggle-btn { display: none !important; }
  }
  .app-viewport.tx-light .fs-toggle-btn {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
    color: #FFF;
  }
  .fs-toggle-btn:hover { transform: scale(1.08); background: rgba(13, 13, 13, 0.25); }

  /* ================= MINIMAL BORDERLESS CHEVRON NAVIGATION ================= */
  .persistent-nav-shell {
    position: absolute;
    left: 0;
    right: 0;
    bottom: clamp(14px, 2.5vh, 22px);
    z-index: 90;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 clamp(16px, 4vw, 40px);
    pointer-events: none;
  }
  .minimal-arrow-btn {
    pointer-events: auto;
    background: none;
    border: none;
    padding: 10px 14px;
    color: var(--ink);
    font-size: clamp(22px, 3vh, 28px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.55;
    transition: opacity 0.2s ease, transform 0.2s ease, color 0.2s ease;
  }
  .app-viewport.tx-light .minimal-arrow-btn {
    color: #FFFFFF;
  }
  .minimal-arrow-btn:hover {
    opacity: 1;
    transform: scale(1.15);
  }
  .minimal-arrow-btn.disabled {
    opacity: 0.15;
    pointer-events: none;
  }
  .minimal-arrow-btn.ready {
    opacity: 1;
    animation: chevronPulse 1.6s infinite ease-in-out;
  }
  @keyframes chevronPulse {
    0%, 100% {
      transform: translateX(0) scale(1);
      opacity: 0.8;
    }
    50% {
      transform: translateX(5px) scale(1.22);
      opacity: 1;
    }
  }
  .minimal-arrow-btn.shake-warn {
    animation: shakeX 0.45s !important;
    opacity: 1;
  }

  /* CONTEXTUAL FLOATING ISLAND */
  .floating-context-island {
    position: absolute;
    left: 50%;
    bottom: clamp(14px, 2.5vh, 22px);
    transform: translateX(-50%);
    z-index: 95;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }
  .tools-capsule {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.95);
    border: 3px solid var(--ink);
    border-radius: 100px;
    padding: 5px 8px;
    box-shadow: 3.5px 3.5px 0 var(--ink);
    backdrop-filter: blur(8px);
  }
  .hl-mini-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #FFF;
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 100px;
    padding: 7px 11px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.12s ease;
    white-space: nowrap;
  }
  .hl-mini-btn:hover { background: #F4F0E8; }
  .hl-mini-btn.active {
    border-width: 2.5px;
    transform: scale(0.96);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.18);
  }
  .hl-mini-btn[data-color="blue"].active { background: rgba(56,189,248,0.3); }
  .hl-mini-btn[data-color="green"].active { background: rgba(34,197,94,0.3); }
  .hl-mini-btn[data-color="yellow"].active { background: rgba(255,199,44,0.4); }
  .hl-mini-btn[data-color="pink"].active { background: rgba(244,63,94,0.3); }

  .hl-swatch {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    flex-shrink: 0;
  }
  .hl-swatch-blue{ background:var(--blue); }
  .hl-swatch-green{ background:var(--green); }
  .hl-swatch-yellow{ background:var(--yellow); }
  .hl-swatch-pink{ background:var(--pink); }

  /* FLANKING HIGHLIGHTER CONTROLS (no pill/button chrome) — sit either side of the action pill */
  .hl-flank-row{
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .hl-flank-btn{
    background: none;
    border: none;
    padding: 2px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hl-flank-btn .hl-swatch{
    width: 13px;
    height: 13px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .hl-flank-btn .hl-flank-label{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: 7px;
    letter-spacing: 0.1px;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.65;
    white-space: nowrap;
  }
  .hl-flank-btn.active .hl-swatch{
    transform: scale(1.25);
    box-shadow: 0 0 0 3px rgba(13,13,13,0.15);
  }
  .hl-flank-btn.active .hl-flank-label{ opacity: 1; }
  .hl-flank-row .action-gate-pill{ padding: 9px 14px; font-size: 11.5px; }
  @media (min-width: 480px) {
    .hl-flank-row{ gap: 9px; }
    .hl-flank-btn .hl-swatch{ width: 15px; height: 15px; }
    .hl-flank-btn .hl-flank-label{ font-size: 8.5px; letter-spacing: 0.3px; }
    .hl-flank-row .action-gate-pill{ padding: 10px 20px; font-size: 13px; }
  }
  @media (min-width: 1024px) {
    .hl-flank-row{ gap: 16px; }
    .hl-flank-btn .hl-swatch{ width: 20px; height: 20px; }
    .hl-flank-btn .hl-flank-label{ font-size: 11px; }
  }

  .action-gate-pill {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    background: #FFF;
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 100px;
    padding: 10px 20px;
    cursor: pointer;
    box-shadow: 3.5px 3.5px 0 var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .action-gate-pill:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .action-gate-pill.ready {
    background: var(--yellow) !important;
    color: var(--ink) !important;
    animation: gentlePulse 2s infinite ease-in-out;
  }
  .action-gate-pill.shake-warn {
    animation: shakeX 0.45s !important;
    background: var(--yellow) !important;
    color: var(--ink) !important;
  }

  @keyframes gentlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  @keyframes shakeX{ 10%,90%{transform:translateX(-3px);} 20%,80%{transform:translateX(5px);} 30%,50%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }

  /* FLOATING NOTICE BADGE */
  .clue-badge{
    position: absolute;
    left: 50%;
    bottom: clamp(76px, 12vh, 96px);
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: var(--ink); color: #FFF;
    font-family:'Space Grotesk', sans-serif; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
    padding: 10px 18px; border-radius: 100px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
    z-index: 100;
    white-space: nowrap;
  }
  .clue-badge i{ color: var(--yellow); }

  /* HEADER & HUD */
  .hud-header{ 
    position:relative; 
    z-index:50; 
    padding: clamp(14px, 2.5vh, 22px) clamp(20px, 4vw, 60px) 6px; 
    width: 100%;
    margin: 0 auto;
    display:flex; 
    flex-direction:column; 
    gap:8px; 
  }
  .progress-container{ position:relative; width:100%; height:7px; background:rgba(13,13,29,0.18); border-radius:100px; }
  .tx-light .progress-container{ background:rgba(255,255,255,0.25); }
  .progress-bar-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--ink); border-radius:100px; transition:width .3s cubic-bezier(.2,.8,.25,1); }
  .tx-light .progress-bar-fill{ background:#FFF; }
  
  .notches-layer{ position:absolute; inset:0; pointer-events:none; }
  .prog-notch{ position:absolute; top:50%; transform:translate(-50%, -50%); width:9px; height:9px; border-radius:50%; background:rgba(13,13,29,0.3); border:1.5px solid rgba(255,255,255,0.6); transition:all .25s ease; }
  .tx-light .prog-notch{ background:rgba(255,255,255,0.4); border-color:rgba(0,0,0,0.3); }
  .prog-notch.passed{ background:var(--lime); border-color:var(--ink); }
  .prog-notch.active{ width:13px; height:13px; background:var(--yellow); border-color:var(--ink); box-shadow:0 0 8px rgba(0,0,0,0.3); animation:notchPulse 1.2s infinite ease-in-out; }
  @keyframes notchPulse{ 0%,100%{ transform:translate(-50%, -50%) scale(1); } 50%{ transform:translate(-50%, -50%) scale(1.25); } }

  .story-meta{ display:flex; justify-content:space-between; font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; opacity:.85; padding-right: 48px; }
  @media (max-width: 767px) {
    .story-meta { padding-right: 0; }
  }
  .story-meta .meta-link-btn{
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    opacity: 0.9;
  }

  /* STAGE & BEATS */
  .stage{ 
    position:relative; 
    flex:1; 
    overflow:hidden; 
    z-index:1; 
    perspective:1400px; 
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  .beat{ 
    position:absolute; 
    inset:0; 
    display:flex; 
    flex-direction:column; 
    padding: clamp(10px, 2vh, 24px) clamp(20px, 4vw, 60px) clamp(70px, 10vh, 85px); 
    opacity:0; 
    transform:translateY(10px) scale(0.98); 
    transition:opacity .25s ease, transform .25s ease; 
    pointer-events:none; 
    z-index:1; 
    background: transparent !important;
  }
  .beat.active{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; z-index:2; }
  .tx-dark{ color:var(--ink); }
  .tx-light{ color:#FFF; }

  /* PAGE-FLIP TRANSITION — used when leaving a book-cover screen (reading-intro, character-prompt) */
  .beat.page-flip-exit{
    animation: pageFlipOut 0.42s cubic-bezier(.45,.05,.55,.95) forwards;
    transform-origin: left center;
    z-index: 6;
    backface-visibility: hidden;
  }
  @keyframes pageFlipOut{
    0%{ transform: rotateY(0deg); opacity:1; }
    100%{ transform: rotateY(-100deg); opacity:0.1; }
  }

  .sketch-lead-title {
    font-family:'Space Grotesk', sans-serif;
    font-size: clamp(24px, 3.8vw, 42px);
    font-weight: 800;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    margin-bottom: clamp(10px, 1.8vh, 24px);
    text-align: left;
    width: 100%;
  }

  /* INTRO SLIDE */
  .intro-top-title{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:.85; margin-bottom:12px; }
  .intro-duration{ font-family:'Space Grotesk', sans-serif; font-size:13.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; opacity:.6; margin-top:16px; display:flex; align-items:center; gap:8px; }
  @media (min-width: 768px) {
    .intro-duration { display: none; }
  }
  .hero-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2; width:100%; max-width:800px; margin:0 auto; }

  .kline{ overflow:hidden; margin-bottom:2px; }
  .kline:last-child{ margin-bottom:0; }
  .kword{ display:inline-block; opacity:0; transform:translateY(16px) scale(0.92); font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-0.3px; text-transform:uppercase; }
  .beat.active .kword{ animation:kwIn .5s cubic-bezier(.2,.85,.25,1) forwards; }
  @keyframes kwIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  .hero-title.xl .kword{ font-size:clamp(42px, 8vw, 76px); line-height:1.05; }
  .emoji{ font-size:42px; line-height:1; margin-bottom:6px; position:relative; z-index:2; }
  @media (min-width: 768px) {
    .hero-wrap{ max-width:960px; }
    .hero-title.xl .kword{ font-size:clamp(56px, 8vw, 140px); }
    .intro-top-title{ font-size:19px; letter-spacing:3px; }
    .emoji{ font-size:56px; margin-bottom:10px; }
  }

  /* SLIDE 1: TESTAMENT CARDS */
  .testament-deck {
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
    min-height: 0;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    justify-content: center;
  }
  @media (min-width: 768px) {
    .testament-deck {
      display: grid;
      grid-template-columns: 1.85fr 1.15fr;
      gap: 28px;
      align-items: stretch;
      max-height: 480px;
    }
  }

  /* SLIDE 2: 5-COLUMN DECK */
  .sections-5-deck {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    overflow-y: auto;
    max-width: 1300px;
    margin: 0 auto;
    width: 100%;
    justify-content: space-evenly;
  }
  @media (max-width: 767px) {
    .sections-5-deck {
      gap: 6px;
      padding: 0 4px 10px 4px;
    }
    .sections-5-deck .deck-card {
      padding: 8px 12px;
      border-width: 2.5px;
      border-radius: 14px;
      box-shadow: 3px 3px 0 var(--ink);
    }
    .sections-5-deck .dc-title { font-size: 15px; margin-bottom: 2px; }
    .sections-5-deck .dc-badge { font-size: 9.5px; padding: 2px 8px; margin-bottom: 4px; }
    .sections-5-deck .dc-desc { font-size: 11px; line-height: 1.3; }
  }
  @media (min-width: 768px) {
    .sections-5-deck {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: center;
      overflow-y: visible;
      align-content: center;
    }
  }
  @media (min-width: 1100px) {
    .sections-5-deck {
      grid-template-columns: repeat(5, 1fr);
    }
    .sections-5-deck .deck-card{ min-height: clamp(280px, 40vh, 420px); }
  }

  .deck-card {
    background: #FFF;
    color: var(--ink);
    border: 3.5px solid var(--ink);
    border-radius: 20px;
    padding: clamp(16px, 2.5vh, 28px);
    cursor: pointer;
    transition: all .14s ease;
    box-shadow: 5px 5px 0 var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    justify-content: center;
  }
  .deck-card:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .deck-card .dc-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(18px, 2.6vh, 24px); font-weight: 800; margin-bottom: 8px; }
  .deck-card .dc-icon { font-size: clamp(22px, 3.4vh, 30px); color: var(--purple); margin-bottom: 8px; }
  .deck-card.correct .dc-icon,
  .deck-card.incorrect .dc-icon { color: inherit; }
  .deck-card .dc-badge { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; background: var(--ink); color: #FFF; padding: 4px 12px; border-radius: 100px; margin-bottom: 10px; }
  .deck-card .dc-desc { font-family: 'Inter', sans-serif; font-size: clamp(12.5px, 1.7vh, 14.5px); font-weight: 700; opacity: 0.85; line-height: 1.45; }
  .deck-card.correct { background: var(--lime) !important; color: var(--ink) !important; box-shadow: 4px 4px 0 var(--ink) !important; }
  .deck-card.incorrect { background: var(--pink) !important; color: #FFF !important; }
  .deck-card.locked { pointer-events: none; }
  .deck-card.shake { animation: shakeX .45s; }
  @media (min-width: 768px) {
    .deck-card .dc-title{ font-size:clamp(22px, 3vh, 30px); }
    .deck-card .dc-desc{ font-size:clamp(15px, 2vh, 17.5px); }
    .testament-deck .deck-card { min-height: 380px; padding: 32px 28px; }
  }
  @media (min-width: 1024px) {
    .testament-deck { max-width: 1500px; max-height: min(64vh, 620px); gap: 40px; }
    .testament-deck .deck-card { min-height: clamp(400px, 60vh, 600px); padding: 48px 40px; border-width: 4.5px; box-shadow: 7px 7px 0 var(--ink); }
    .testament-deck .dc-title { font-size: clamp(34px, 4.4vh, 46px); margin-bottom: 16px; }
    .testament-deck .dc-badge { font-size: 15px; padding: 8px 18px; margin-bottom: 18px; }
    .testament-deck .dc-desc { font-size: clamp(19px, 2.4vh, 24px); line-height: 1.55; max-width: 480px; }
  }
  @media (min-width: 1500px) {
    .testament-deck { max-width: 1700px; }
    .testament-deck .dc-desc { max-width: 540px; }
  }
  @media (max-width: 767px) {
    .sections-5-deck .dc-icon{ font-size: 18px; margin-bottom: 2px; color: var(--purple); }
  }
  @media (min-width: 1100px) {
    .sections-5-deck .dc-icon{ font-size: clamp(42px, 6vh, 64px); margin-bottom: 16px; }
  }

  /* SLIDE 3: RECAP */
  .set-scene-grid {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    gap: 20px;
    align-items: center;
    justify-content: center;
    max-width: 1300px;
    margin: 0 auto;
    width: 100%;
  }
  @media (min-width: 768px) {
    .set-scene-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 50px;
      align-items: center;
    }
  }

  .folder-wrap{ display:flex; flex-direction:column; justify-content:flex-start; width:100%; position:relative; z-index:2; }
  .folder-tab{ align-self:flex-start; margin-left:8px; background:#E4B563; border:3.5px solid var(--ink); border-bottom:none; border-radius:10px 10px 0 0; padding:6px 18px 8px 18px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--ink); position:relative; z-index:3; margin-bottom:-4px; flex-shrink:0; }
  .folder-body{ display:flex; flex-direction:column; justify-content:space-evenly; background:#F3D48B; border:3.5px solid var(--ink); border-radius:3px 18px 18px 18px; box-shadow:5px 5px 0 var(--ink); padding:18px 22px; position:relative; z-index:2; flex-shrink:0; gap:14px; }

  /* SLIDE 4: PRAYER (KICKER IN CIRCLE: PRAYER) */

  /* BIBLE COVER */

function kw(lines, extraClass){
  let i = 0;
  const body = lines.map(line=>{

      return `<span class="kword" style="animation-delay:${delay}s">${w}</span>`;
    }).join(' ');
    return `<div class="kline">${words}</div>`;
  }).join('');
  return `<div class="hero-title${extraClass ? ' '+extraClass : ''}">${body}</div>`;
}

const paragraphEnds = [28, 31, 34, 39, 44, 45];

function passageWordsHTML(){
  let out = '<p class="flow-para">';
  passage.forEach((v,i)=>{
    const verseNum = i + 21;
    const words = v.replace(/—(?=\S)/g, '— ').split(/\s+/);
    const normed = words.map(normWord);
    const pieces = [];
    let wi = 0;
    while (wi < words.length) {
      const marker = wi === 0 ? `<span class="verse-num-inline">${verseNum}</span>` : '';
      const match = phrases.find(p => p.words.every((pw,k) => normed[wi+k] === pw));
      if (match) {
        const span = words.slice(wi, wi + match.words.length).join(' ');
        pieces.push(`${marker}<span class="w" data-word="${match.key}" onclick="tapWord(event,this)">${span}</span>`);
        wi += match.words.length;
        continue;
      }
      const norm = normed[wi];
      pieces.push(`${marker}<span class="w" data-word="${norm}" onclick="tapWord(event,this)">${words[wi]}</span>`);
      wi++;
    }
    out += pieces.join(' ') + ' ';
    if (paragraphEnds.includes(verseNum) && verseNum !== 45) out += '</p><p class="flow-para">';
  });
  out += '</p>';
  return out;
}

}

function tapWord(e, el){
  e.stopPropagation();
  const key = el.dataset.word;
  if (!key) return;
  const word = el.textContent.trim().replace(/^[^A-Za-z']+/, '').replace(/[^A-Za-z']+$/, '');
  const def = defs[key] || null;
  const isStop = stopWords.has(key);

  if (state.activeTool.vocab) {
    const cls = 'hl-' + state.activeTool.vocab;
    const alreadyThisColor = el.classList.contains(cls);
    ['hl-blue','hl-green','hl-yellow','hl-pink','flagged','flagged-light'].forEach(c => el.classList.remove(c));
    
    if (!alreadyThisColor) {
      el.classList.add(cls);
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
      state.wordTaps.push({ el, word, def, isStop, key });
    } else {
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
    }
  } else {
    const isColored = ['hl-blue','hl-green','hl-yellow','hl-pink'].some(c=>el.classList.contains(c));
    if (isColored) {
      ['hl-blue','hl-green','hl-yellow','hl-pink'].forEach(c => el.classList.remove(c));
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
    } else if (el.classList.contains('flagged')) {
      // second tap: lighten instead of removing the flag entirely
      el.classList.remove('flagged');
      el.classList.add('flagged-light');
    } else if (el.classList.contains('flagged-light')) {
      // third tap: back to full flag
      el.classList.remove('flagged-light');
      el.classList.add('flagged');
    } else {
      el.classList.add('flagged');
      state.wordTaps.push({ el, word, def, isStop, key });
    }
  }
  updateNavShell();
}

function renderVocabReview(){
  const box = document.getElementById('vocabReviewBox');
  if (state.wordTaps.length === 0) {
    box.innerHTML = `<div class="glossary-panel"><div class="review-def-entry" style="border:none; opacity:0.7;">No words highlighted yet!</div></div>`;
    return;
  }
  
  const defined = [];
  const undefinedWords = [];
  const seen = new Set();

  state.wordTaps.forEach(w => {
    const norm = normWord(w.word);
    if (seen.has(norm)) return;
    seen.add(norm);

    const fullDef = defs[w.key] || defs[norm];
    if (fullDef) {
      defined.push({ word: w.word, def: fullDef });
    } else {
      undefinedWords.push(w.word);
    }
  });

  let html = '<div class="glossary-panel">';
  if (defined.length > 0) {
    html += `<div class="review-section-header"><i class="fa-solid fa-book-bookmark"></i> Defined Terms</div>`;
    html += defined.map((w,i) => `<div class="review-def-entry"><span class="term-word"><span class="gloss-num">${i+1}</span>${w.word}</span>${w.def}</div>`).join('');
  }
  if (undefinedWords.length > 0) {
    html += `<div class="review-section-header"><i class="fa-solid fa-magnifying-glass"></i> Terms to Define</div>
             <div class="pill-cloud">${undefinedWords.map(word => `<div class="research-pill">${word}</div>`).join('')}</div>`;
  }
  html += '</div>';
  box.innerHTML = html;
}

/* 2 MINUTE TIMER LOGIC */
let timerSeconds = 120;
let timerInterval = null;
let timerRunning = false;

function toggleTimer(){
  const card = document.getElementById('timerCard');
  const btn = document.getElementById('timerBtn');
  const digits = document.getElementById('timerDigits');
  
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    card.classList.remove('running');
    btn.innerHTML = '<i class="fa-solid fa-play"></i> Resume';
  } else {
    if (timerSeconds <= 0) timerSeconds = 120;
    timerRunning = true;
    card.classList.add('running');
    btn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
    
    timerInterval = setInterval(() => {
      timerSeconds--;
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      digits.textContent = `${mins}:${secs}`;
      
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        card.classList.remove('running');
        btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Restart';
      }
    }, 1000);
  }
}

function handleForwardAttempt(){
  const b = beats[state.index];
  if (b.blockTap) {
    if ((b.id === 'quest-testament' || b.id === 'quest-section') && !answeredBeats.has(state.index)) { 
      triggerGateShake('Pick an answer to continue', 'findBookPill', 'fa-solid fa-hand-point-up'); 
      return; 
    }
    if (b.id === 'vocab-scan') {
      if (!state.wordTaps.length && !state.scrolledToEnd) {
        triggerGateShake('Highlight at least 1 word & scroll down!', 'vocabActionPill');
        return;
      } else if (!state.wordTaps.length) {
        triggerGateShake('Highlight at least 1 word!', 'vocabActionPill');
        return;
      } else if (!state.scrolledToEnd) {
        triggerGateShake('Scroll to the bottom first!', 'vocabActionPill');
        return;
      }
    }
    if (b.id === 'char-verse-pick' && state.charVerse === null) { 
      triggerGateShake('Tap a verse to select!', 'verseActionPill'); 
      return; 
    }
    if (b.id === 'char-coaching' && !(state.trait && state.trait.trim())) { 
      triggerGateShake('Fill in the blank to continue!'); 
      return; 
    }
  }
  goNext();
}

function fitCharVerseText(){
  const vt = document.getElementById('charText');
  const card = vt ? vt.closest('.dark-scripture-card') : null;
  const beatEl = card ? card.closest('.beat') : null;
  if (!vt || !card || !beatEl) return;
  vt.style.fontSize = '';
  const maxFont = parseFloat(getComputedStyle(vt).fontSize);
  let fontSize = maxFont;
  const minFont = Math.max(11, maxFont * 0.5);
  let guard = 0;
  while (beatEl.scrollHeight > beatEl.clientHeight + 2 && fontSize > minFont && guard < 50) {
    fontSize -= 0.5;
    vt.style.fontSize = fontSize + 'px';
    guard++;
  }
}

const PAGE_FLIP_BEAT_IDS = ['reading-intro', 'character-prompt'];
function goNext(){
  if (state.index < beats.length - 1) {
    const leavingBeat = beats[state.index];
    if (PAGE_FLIP_BEAT_IDS.includes(leavingBeat.id)) {
      const el = document.getElementById('beat-' + state.index);
      if (el) {
        el.classList.add('page-flip-exit');
        setTimeout(() => {
          el.classList.remove('page-flip-exit');
          state.index++; renderBeat(state.index);
        }, 380);
        return;
      }
    }
    state.index++; renderBeat(state.index);
  }
}

function goPrev(){

    state.index--; renderBeat(state.index);

}

document.addEventListener('keydown', (e) => {
  const inField = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable;
  if (!inField && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp')) {
    const scrollable = document.querySelector(
      '.beat.active .passage-scroll, .beat.active .verse-pick-list, .beat.active .review-scroll'
    );
    if (scrollable) {
      const amount = (e.key === 'PageDown' || e.key === 'PageUp')
        ? scrollable.clientHeight * 0.9
        : 220;
      const dir = (e.key === 'ArrowDown' || e.key === 'PageDown') ? 1 : -1;
      scrollable.scrollBy({ top: amount * dir, behavior: 'smooth' });
      return;
    }
  }
  if (e.key === 'ArrowRight') handleForwardAttempt();
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key.toLowerCase() === 'f' && e.target.tagName !== 'INPUT') toggleFullScreen();
});

/* TAP-ZONE + SWIPE NAVIGATION */
(function initGestureNav(){
  const stageEl = document.getElementById('stage');
  if (!stageEl) return;
  const LEFT_ZONE = 0.28;
  const SWIPE_THRESHOLD = 60;
  let lastSwipeTime = 0;

  stageEl.addEventListener('click', (e) => {
    if (Date.now() - lastSwipeTime < 500) return;
    const b = beats[state.index];
    const rect = stageEl.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    if (relX < LEFT_ZONE) {
      goPrev();
    } else if (!b.blockTap) {
      goNext();
    }
  });

  let touchStartX = 0, touchStartY = 0, touchTracking = false;
  stageEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchTracking = true;
  }, { passive: true });

  stageEl.addEventListener('touchend', (e) => {
    if (!touchTracking) return;
    touchTracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESHOLD) {
      lastSwipeTime = Date.now();
      const b = beats[state.index];
      if (dx < 0) {
        if (!b.blockTap) goNext();
      } else {
        goPrev();
      }
    }
  }, { passive: true });

  stageEl.addEventListener('touchcancel', () => { touchTracking = false; }, { passive: true });
})();

    const txt = notes[key];
    if (txt && txt.trim()) lines.push(`[${i}] ${b.id}:\n${txt.trim()}`);
  });
  return lines.length ? lines.join('\n\n') : 'No notes yet.';
}

  const status = document.getElementById('dnpStatus');
  const retryBtn = document.getElementById('dnpRetryBtn');
  panel.focus();
  panel.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(panel.value).then(() => {
      status.textContent = '✓ Copied to clipboard';
      status.className = 'dnp-status ok';
      retryBtn.style.display = 'none';
    }).catch(() => {
      status.textContent = 'Copy failed — select the text above and copy manually.';
      status.className = 'dnp-status warn';
      retryBtn.style.display = 'inline-block';
    });
  } else {
    status.textContent = 'Clipboard unavailable — select the text above and copy manually.';
    status.className = 'dnp-status warn';
    retryBtn.style.display = 'inline-block';
  }
}

initNotches();
renderBeat(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MS Hang Prep — Mark 1:21–45</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --paper:#FFFFFF;
    --cream:#EAE6DF;
    --lime:#C3F53C;
    --pink:#F43F5E;
    --blue:#38BDF8;
    --yellow:#FFC72C;
    --purple:#A855F7;
    --green:#22C55E;

    --bg-lime: linear-gradient(145deg, #d2f860 0%, #a2e014 100%);
    --bg-purple: linear-gradient(145deg, #b862f8 0%, #7e22ce 100%);
    --bg-pink: linear-gradient(145deg, #fb5672 0%, #be123c 100%);
    --bg-dark: linear-gradient(145deg, #1f1f23 0%, #0a0a0c 100%);
    --bg-cream: linear-gradient(145deg, #f4f0e8 0%, #d8d2c7 100%);
    --bg-yellow: linear-gradient(145deg, #ffd452 0%, #eab308 100%);

    --bg-discover:  linear-gradient(145deg, #ff9b5c 0%, #ff6a1f 100%);
    --bg-wordwork:  linear-gradient(145deg, #881337 0%, #4c0519 100%);
    --bg-expand:    linear-gradient(145deg, #e37ac4 0%, #c736a0 100%);
    --bg-learn:     linear-gradient(145deg, #8f7aff 0%, #6339f0 100%);
    --bg-live:      linear-gradient(145deg, #3b1b63 0%, #17082c 100%);

    --bg-terracotta: linear-gradient(145deg, #e48d75 0%, #a15844 100%);
    --bg-orange: linear-gradient(145deg, #f6af77 0%, #b07546 100%);
    --bg-leather: linear-gradient(160deg, #442411 0%, #200e05 100%);

    --hl-hover-color: rgba(255, 199, 44, 0.35);
  }

  :root[data-theme="northern"] {
    --bg-discover:  linear-gradient(145deg, #4dedc7 0%, #00b894 100%);
    --bg-wordwork:  linear-gradient(145deg, #7f1d1d 0%, #450a0a 100%);
    --bg-expand:    linear-gradient(145deg, #5c8fff 0%, #2554d6 100%);
    --bg-learn:     linear-gradient(145deg, #6d7eff 0%, #3644b8 100%);
    --bg-live:      linear-gradient(145deg, #2b1747 0%, #0e051d 100%);
    --bg-cream:     linear-gradient(145deg, #eef5f8 0%, #d7e6ec 100%);
  }
  *{box-sizing:border-box;}
  
  html, body { 
    margin:0; 
    padding:0; 
    width:100%; 
    height:100%; 
    background:var(--ink); 
    font-family:'Inter', sans-serif; 
    -webkit-tap-highlight-color: transparent; 
    overscroll-behavior:none; 
    overflow:hidden;
  }

  .app-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: var(--bg-cream);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background .4s ease;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .invisible-fs-hit {
    position: absolute;
    top: 0;
    right: 0;
    width: 70px;
    height: 70px;
    z-index: 120;
    cursor: pointer;
    background: transparent;
  }

  .ptp-head {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--ink);
  }
  .ptp-list { display: flex; flex-direction: column; gap: 8px; }
  .ptp-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px;
    background: #FBFBFB;
    border: 2px solid var(--ink);
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: transform 0.12s ease;
  }
  .ptp-card:hover { transform: translate(-1px, -1px); }
  .ptp-card.active { background: var(--yellow); box-shadow: 2px 2px 0 var(--ink); }
  .ptp-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 800;
  }
  .ptp-swatches { display: flex; gap: 4px; height: 14px; border-radius: 4px; overflow: hidden; }
  .ptp-swatches span { flex: 1; }

  /* ================= MINIMAL BORDERLESS CHEVRON NAVIGATION ================= */
  .persistent-nav-shell {
    position: absolute;
    left: 0;
    right: 0;
    bottom: clamp(14px, 2.5vh, 22px);
    z-index: 90;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 clamp(16px, 4vw, 40px);
    pointer-events: none;
  }
  .minimal-arrow-btn {
    pointer-events: auto;
    background: none;
    border: none;
    padding: 10px 14px;
    color: var(--ink);
    font-size: clamp(22px, 3vh, 28px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.55;
    transition: opacity 0.2s ease, transform 0.2s ease, color 0.2s ease;
  }
  .app-viewport.tx-light .minimal-arrow-btn {
    color: #FFFFFF;
  }
  .minimal-arrow-btn:hover {
    opacity: 1;
    transform: scale(1.15);
  }
  .minimal-arrow-btn.disabled {
    opacity: 0.15;
    pointer-events: none;
  }
  .minimal-arrow-btn.ready {
    opacity: 1;
    animation: chevronPulse 1.6s infinite ease-in-out;
  }
  @keyframes chevronPulse {
    0%, 100% {
      transform: translateX(0) scale(1);
      opacity: 0.8;
    }
    50% {
      transform: translateX(5px) scale(1.22);
      opacity: 1;
    }
  }
  .minimal-arrow-btn.shake-warn {
    animation: shakeX 0.45s !important;
    opacity: 1;
  }

  /* CONTEXTUAL FLOATING ISLAND */
  .floating-context-island {
    position: absolute;
    left: 50%;
    bottom: clamp(14px, 2.5vh, 22px);
    transform: translateX(-50%);
    z-index: 95;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }

  /* RIGHT SIDE HIGHLIGHT DRAWER / TOOLBOX */
  .side-drawer-dock {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 110;
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    transition: transform 0.3s cubic-bezier(0.2, 0.85, 0.25, 1);
  }
  .side-drawer-dock.collapsed {
    transform: translateY(-50%) translateX(calc(100% - 36px));
  }
  .side-drawer-content {
    background: #FFFFFF;
    border: 3px solid var(--ink);
    border-right: none;
    border-radius: 20px 0 0 20px;
    box-shadow: -4px 4px 0 var(--ink);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .side-drawer-toggle {
    width: 36px;
    height: 60px;
    background: #FFFFFF;
    border: 3px solid var(--ink);
    border-right: none;
    border-radius: 16px 0 0 16px;
    box-shadow: -4px 0 0 var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    font-size: 14px;
    transition: background 0.15s ease;
  }
  .side-drawer-toggle:hover { background: var(--cream); }
  
  /* Points LEFT when collapsed (pull out affordance), rotates RIGHT when open */
  .side-drawer-dock.collapsed .side-drawer-toggle i {
    transform: rotate(0deg);
  }
  .side-drawer-dock:not(.collapsed) .side-drawer-toggle i {
    transform: rotate(180deg);
  }
  .side-drawer-toggle i {
    transition: transform 0.25s ease;
  }

  .side-tool-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 2px solid transparent;
    border-radius: 100px;
    padding: 4px 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .side-tool-row:hover { background: rgba(0,0,0,0.05); }
  .side-tool-row.active {
    background: var(--cream);
    border-color: var(--ink);
  }
  .side-tool-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--ink);
  }

  .hl-swatch {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    flex-shrink: 0;
  }
  .hl-swatch-blue{ background:var(--blue); }
  .hl-swatch-green{ background:var(--green); }
  .hl-swatch-yellow{ background:var(--yellow); }
  .hl-swatch-pink{ background:var(--pink); }

  .action-gate-pill {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    background: #FFF;
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 100px;
    padding: 10px 20px;
    cursor: pointer;
    box-shadow: 3.5px 3.5px 0 var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .action-gate-pill:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .action-gate-pill.ready {
    background: var(--yellow) !important;
    color: var(--ink) !important;
    animation: gentlePulse 2s infinite ease-in-out;
  }
  .action-gate-pill.shake-warn {
    animation: shakeX 0.45s !important;
    background: var(--yellow) !important;
    color: var(--ink) !important;
  }

  @keyframes gentlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  @keyframes shakeX{ 10%,90%{transform:translateX(-3px);} 20%,80%{transform:translateX(5px);} 30%,50%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }

  /* FLOATING NOTICE BADGE */
  .clue-badge{
    position: absolute;
    left: 50%;
    bottom: clamp(76px, 12vh, 96px);
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: var(--ink); color: #FFF;
    font-family:'Space Grotesk', sans-serif; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
    padding: 10px 18px; border-radius: 100px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
    z-index: 100;
    white-space: nowrap;
  }
  .clue-badge i{ color: var(--yellow); }

  /* HEADER & HUD (ORIGINAL CLEAN STYLE) */
  .hud-header{ 
    position:relative; 
    z-index:50; 
    padding: clamp(14px, 2.5vh, 22px) clamp(20px, 4vw, 60px) 6px; 
    width: 100%;
    margin: 0 auto;
    display:flex; 
    flex-direction:column; 
    gap:8px; 
  }

  .progress-container{ position:relative; width:100%; height:7px; background:rgba(13,13,29,0.18); border-radius:100px; }
  .tx-light .progress-container{ background:rgba(255,255,255,0.25); }
  .progress-bar-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--ink); border-radius:100px; transition:width .3s cubic-bezier(.2,.8,.25,1); }
  .tx-light .progress-bar-fill{ background:#FFF; }
  
  .notches-layer{ position:absolute; inset:0; pointer-events:none; }
  .prog-notch{ position:absolute; top:50%; transform:translate(-50%, -50%); width:9px; height:9px; border-radius:50%; background:rgba(13,13,29,0.3); border:1.5px solid rgba(255,255,255,0.6); transition:all .25s ease; }
  .tx-light .prog-notch{ background:rgba(255,255,255,0.4); border-color:rgba(0,0,0,0.3); }
  .prog-notch.passed{ background:var(--lime); border-color:var(--ink); }
  .prog-notch.active{ width:13px; height:13px; background:var(--yellow); border-color:var(--ink); box-shadow:0 0 8px rgba(0,0,0,0.3); animation:notchPulse 1.2s infinite ease-in-out; }
  @keyframes notchPulse{ 0%,100%{ transform:translate(-50%, -50%) scale(1); } 50%{ transform:translate(-50%, -50%) scale(1.25); } }

  .story-meta{ display:flex; align-items:center; justify-content:space-between; font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; opacity:.85; }
  .story-meta .meta-link-btn{
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    opacity: 0.9;
  }

  /* STAGE & BEATS */
  .stage{ 
    position:relative; 
    flex:1; 
    overflow:hidden; 
    z-index:1; 
    perspective:1400px; 
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  .beat{ 
    position:absolute; 
    inset:0; 
    display:flex; 
    flex-direction:column; 
    padding: clamp(10px, 2vh, 24px) clamp(16px, 3.5vw, 48px) clamp(65px, 9vh, 85px); 
    opacity:0; 
    transform:translateY(10px) scale(0.98); 
    transition:opacity .25s ease, transform .25s ease; 
    pointer-events:none; 
    z-index:1; 
    background: transparent !important;
  }
  .beat.active{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; z-index:2; }
  .tx-dark{ color:var(--ink); }
  .tx-light{ color:#FFF; }

  .beat.page-flip-exit{
    animation: pageFlipOut 0.42s cubic-bezier(.45,.05,.55,.95) forwards;
    transform-origin: left center;
    z-index: 6;
    backface-visibility: hidden;
  }
  @keyframes pageFlipOut{
    0%{ transform: rotateY(0deg); opacity:1; }
    100%{ transform: rotateY(-100deg); opacity:0.1; }
  }

  .sketch-lead-title {
    font-family:'Space Grotesk', sans-serif;
    font-size: clamp(22px, 3.4vh, 44px);
    font-weight: 800;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    margin-bottom: clamp(10px, 1.8vh, 22px);
    text-align: left;
    width: 100%;
    flex-shrink: 0;
  }

  .mark-box {
    background: var(--ink);
    color: #FFFFFF;
    padding: 2px 10px;
    border-radius: 8px;
    display: inline-block;
    letter-spacing: 0.5px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.25);
  }

  /* INTRO SLIDE */
  .intro-top-title{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:.85; margin-bottom:12px; }
  .intro-duration{ font-family:'Space Grotesk', sans-serif; font-size:13.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; opacity:.6; margin-top:16px; display:flex; align-items:center; gap:8px; }
  @media (min-width: 768px) {
    .intro-duration { display: none; }
  }
  .hero-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2; width:100%; max-width:800px; margin:0 auto; }

  .kline{ overflow:hidden; margin-bottom:2px; }
  .kline:last-child{ margin-bottom:0; }
  .kword{ display:inline-block; opacity:0; transform:translateY(16px) scale(0.92); font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-0.3px; text-transform:uppercase; }
  .beat.active .kword{ animation:kwIn .5s cubic-bezier(.2,.85,.25,1) forwards; }
  @keyframes kwIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  .hero-title.xl .kword{ font-size:clamp(42px, 8vw, 76px); line-height:1.05; }
  .emoji{ font-size:42px; line-height:1; margin-bottom:6px; position:relative; z-index:2; }
  @media (min-width: 768px) {
    .hero-wrap{ max-width:960px; }
    .hero-title.xl .kword{ font-size:clamp(56px, 8vw, 140px); }
    .intro-top-title{ font-size:19px; letter-spacing:3px; }
    .emoji{ font-size:56px; margin-bottom:10px; }
  }

  /* SLIDE 1: TESTAMENT CARDS */
  .testament-deck-fill {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr;
    gap: clamp(12px, 2.2vh, 32px);
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 1700px;
    margin: 0 auto;
  }
  @media (min-width: 768px) {
    .testament-deck-fill {
      grid-template-columns: 1.15fr 1fr;
      grid-template-rows: 1fr;
      gap: clamp(20px, 3.5vw, 56px);
    }
  }

  .deck-card-fill {
    background: #FFF;
    color: var(--ink);
    border: clamp(3.5px, 0.45vh, 5.5px) solid var(--ink);
    border-radius: clamp(18px, 3vh, 36px);
    padding: clamp(16px, 3.5vh, 52px) clamp(18px, 3vw, 52px);
    box-shadow: clamp(5px, 0.9vh, 10px) clamp(5px, 0.9vh, 10px) 0 var(--ink);
    cursor: pointer;
    transition: all .14s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: clamp(10px, 2.4vh, 32px);
    height: 100%;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  .deck-card-fill:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  .deck-card-fill .dc-main-icon {
    font-size: clamp(38px, 7vh, 88px);
    color: var(--ink);
    line-height: 1;
    flex-shrink: 0;
  }
  .deck-card-fill .dc-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(26px, 5.2vh, 64px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -1px;
  }
  .deck-card-fill .dc-badge {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(12px, 2.2vh, 22px);
    font-weight: 800;
    background: var(--ink);
    color: #FFF;
    padding: clamp(6px, 1.1vh, 14px) clamp(14px, 2vw, 28px);
    border-radius: 100px;
    letter-spacing: 0.4px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .deck-card-fill .dc-badge i {
    color: var(--yellow);
    font-size: 0.95em;
  }
  .deck-card-fill .dc-desc {
    font-family: 'Inter', sans-serif;
    font-size: clamp(14.5px, 2.8vh, 30px);
    font-weight: 700;
    line-height: 1.45;
    opacity: 0.94;
    max-width: 720px;
  }
  .deck-card-fill.correct { background: var(--lime) !important; color: var(--ink) !important; }
  .deck-card-fill.incorrect { background: var(--pink) !important; color: #FFF !important; }
  .deck-card-fill.locked { pointer-events: none; }
  .deck-card-fill.shake { animation: shakeX .45s; }

  @media (min-width: 1024px) {
    .deck-card-fill {
      padding: clamp(24px, 4.5vh, 64px) clamp(28px, 4vw, 64px);
      gap: clamp(14px, 3vh, 36px);
    }
    .deck-card-fill .dc-main-icon {
      font-size: clamp(52px, 8.5vh, 100px);
    }
    .deck-card-fill .dc-title {
      font-size: clamp(34px, 5.8vh, 68px);
    }
    .deck-card-fill .dc-badge {
      font-size: clamp(14px, 2.4vh, 24px);
      padding: clamp(8px, 1.2vh, 16px) clamp(18px, 2.2vw, 32px);
    }
    .deck-card-fill .dc-desc {
      font-size: clamp(18px, 3vh, 32px);
      line-height: 1.5;
    }
  }

  /* SLIDE 2: 5-SECTION DECK */
  .sections-5-fill {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: repeat(5, 1fr);
    gap: clamp(8px, 1.4vh, 16px);
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 1700px;
    margin: 0 auto;
  }
  @media (min-width: 768px) {
    .sections-5-fill {
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: 1fr;
      gap: clamp(12px, 1.8vw, 24px);
    }
  }

  .sec-card-fill {
    background: #FFF;
    color: var(--ink);
    border: clamp(3px, 0.4vh, 4.5px) solid var(--ink);
    border-radius: clamp(14px, 2.4vh, 26px);
    padding: clamp(10px, 1.8vh, 28px) clamp(14px, 1.6vw, 24px);
    box-shadow: clamp(4px, 0.7vh, 8px) clamp(4px, 0.7vh, 8px) 0 var(--ink);
    cursor: pointer;
    transition: all .14s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    min-height: 0;
  }
  .sec-card-fill:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .sec-card-fill .sc-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sec-card-fill .sc-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(17px, 2.8vh, 32px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.4px;
  }
  .sec-card-fill .sc-badge {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(10.5px, 1.5vh, 16px);
    font-weight: 800;
    background: var(--ink);
    color: #FFF;
    padding: clamp(3px, 0.6vh, 6px) clamp(9px, 1.2vw, 14px);
    border-radius: 100px;
    white-space: nowrap;
  }
  .sec-card-fill .sc-desc {
    font-family: 'Inter', sans-serif;

function quoteVerse(text){
  const t = (text||'').trim();
  const startsWithQuote = /^["“]/.test(t);
  const endsWithQuote = /["”]$/.test(t);
  return (startsWithQuote ? '' : '"') + text + (endsWithQuote ? '' : '"');

function normWord(w){ return w.replace(/[^a-zA-Z']/g,'').toLowerCase(); }

function kw(lines, extraClass){
  let i = 0;
  const body = lines.map(line=>{
    const words = line.map(w=>{
      const delay = (i * 0.09).toFixed(2); i++;
      return `<span class="kword" style="animation-delay:${delay}s">${w}</span>`;
    }).join(' ');
    return `<div class="kline">${words}</div>`;
  }).join('');
  return `<div class="hero-title${extraClass ? ' '+extraClass : ''}">${body}</div>`;
}

const paragraphEnds = [28, 31, 34, 39, 44, 45];

function passageWordsHTML(){
  let out = '<p class="flow-para">';
  passage.forEach((v,i)=>{
    const verseNum = i + 21;
    const words = v.replace(/—(?=\S)/g, '— ').split(/\s+/);
    const normed = words.map(normWord);
    const pieces = [];
    let wi = 0;
    while (wi < words.length) {
      const marker = wi === 0 ? `<span class="verse-num-inline">${verseNum}</span>` : '';
      const match = phrases.find(p => p.words.every((pw,k) => normed[wi+k] === pw));
      if (match) {
        const span = words.slice(wi, wi + match.words.length).join(' ');
        pieces.push(`${marker}<span class="w" data-word="${match.key}" onclick="tapWord(event,this)">${span}</span>`);
        wi += match.words.length;
        continue;
      }
      const norm = normed[wi];
      pieces.push(`${marker}<span class="w" data-word="${norm}" onclick="tapWord(event,this)">${words[wi]}</span>`);
      wi++;
    }
    out += pieces.join(' ') + ' ';
    if (paragraphEnds.includes(verseNum) && verseNum !== 45) out += '</p><p class="flow-para">';
  });
  out += '</p>';
  return out;
}

function versePickHTML(){
  return passage.map((v,i)=>`

}

function initNotches(){
  const layer = document.getElementById('notchesLayer');
  layer.innerHTML = '';
  const total = beats.length;
  beats.forEach((b, i) => {
    if (b.isInteractive) {
      const notch = document.createElement('div');
      notch.className = 'prog-notch';
      notch.id = `notch-${i}`;
      const pct = (i / (total - 1)) * 100;
      notch.style.left = `${pct}%`;
      layer.appendChild(notch);
    }
  });
}

function updateProgressBar(){
  const fill = document.getElementById('progressBarFill');
  const total = beats.length;
  const pct = (state.index / (total - 1)) * 100;
  fill.style.width = `${pct}%`;

  beats.forEach((b, i) => {
    if (b.isInteractive) {
      const notch = document.getElementById(`notch-${i}`);
      if (!notch) return;
      notch.classList.remove('passed', 'active');
      if (state.index > i) notch.classList.add('passed');
      else if (state.index === i) notch.classList.add('active');
    }
  });
}

function updateNavShell(){
  const prevBtn = document.getElementById('shellPrevBtn');
  const nextBtn = document.getElementById('shellNextBtn');
  const island = document.getElementById('floatingContextIsland');
  const sideDock = document.getElementById('sideDrawerDock');
  const b = beats[state.index];

  prevBtn.classList.toggle('disabled', state.index === 0);

  let ready = false;
  if (b.id === 'vocab-scan') ready = isVocabComplete();
  else if (b.id === 'char-verse-pick') ready = state.charVerse !== null;
  else if (b.id === 'char-coaching') ready = Boolean(state.trait && state.trait.trim());
  else if (b.id === 'quest-testament' || b.id === 'quest-section') ready = answeredBeats.has(state.index);
  else ready = !b.blockTap;
  nextBtn.classList.toggle('ready', ready);

  prevBtn.style.display = '';
  nextBtn.style.display = '';

  if (b.id === 'vocab-scan') {
    sideDock.style.display = 'flex';
    island.style.display = 'flex';
    const isDone = isVocabComplete();
    island.innerHTML = `
      <button class="action-gate-pill ${isDone ? 'ready' : ''}" id="vocabActionPill" onclick="event.stopPropagation(); handleForwardAttempt();">
        ${isDone ? '<i class="fa-solid fa-check"></i> Continue' : 'Highlight Words'}

    updateDrawerActiveStates();
  } else if (b.id === 'char-verse-pick') {
    sideDock.style.display = 'none';
    island.style.display = 'flex';
    const isPicked = state.charVerse !== null;
    island.innerHTML = `
      <button class="action-gate-pill ${isPicked ? 'ready' : ''}" id="verseActionPill" onclick="event.stopPropagation(); handleForwardAttempt();">

function renderBeat(i){
  document.querySelectorAll('.beat').forEach(el=>el.classList.remove('active'));
  document.getElementById(`beat-${i}`).classList.add('active');
  renderGen++;
  const b = beats[i];

  phoneEl.style.background = b.bgGrad;
  if (b.text === 'light') {
    phoneEl.classList.add('tx-light');
    phoneEl.classList.remove('tx-dark');
    document.getElementById('hudHeader').className = 'hud-header tx-light';
  } else {
    phoneEl.classList.add('tx-dark');
    phoneEl.classList.remove('tx-light');
    document.getElementById('hudHeader').className = 'hud-header tx-dark';
  }

  updateHeaderMeta();
  updateNavShell();

  if (b.id === 'char-coaching') {
    const activeVerse = state.charVerse || 21;
    document.getElementById('charRef').textContent = 'Mark 1:' + activeVerse;
    document.getElementById('charText').textContent = quoteVerse(passage[activeVerse-21]);
    const arcStem = document.getElementById('arcStemText');
    if (arcStem) arcStem.textContent = `BASED ON VERSE ${activeVerse}:`;
    const inp = document.getElementById('customTraitInput');
    if (inp) inp.value = state.trait || '';
    requestAnimationFrame(() => requestAnimationFrame(fitCharVerseText));
  } else if (b.id === 'char-verse-pick') {
    document.querySelectorAll('#beat-'+i+' .verse-tile').forEach(t=>t.classList.toggle('selected', state.charVerse !== null && Number(t.dataset.v)===state.charVerse));
  } else if (b.id === 'vocab-scan') {
    checkPassageScroll();
  }

  if (b.id === 'final') renderFinalReflection();
  if (b.id === 'vocab-review') renderVocabReview();
  updateProgressBar();
  if (devMode) renderDevBubbles();
}

const answeredBeats = new Set();
function questAnswer(e, el, gridId){
  e.stopPropagation();
  if (el.classList.contains('locked')) return;
  const isCorrect = el.dataset.correct === 'true';
  if (isCorrect) {
    const grid = document.getElementById(gridId);
    grid.querySelectorAll('.deck-card-fill, .sec-card-fill').forEach(t=>t.classList.add('locked'));
    el.classList.add('correct');
    answeredBeats.add(state.index);
    updateNavShell();
    const myGen = renderGen;
    setTimeout(()=>{ if (renderGen === myGen) goNext(); }, 600);
  } else {
    el.classList.add('incorrect','shake');
    setTimeout(()=>{ el.classList.remove('shake','incorrect'); }, 500);
  }
}

function tapWord(e, el){
  e.stopPropagation();
  const key = el.dataset.word;
  if (!key) return;
  const word = el.textContent.trim().replace(/^[^A-Za-z']+/, '').replace(/[^A-Za-z']+$/, '');
  const def = defs[key] || null;
  const isStop = stopWords.has(key);

  if (state.activeTool.vocab) {
    const cls = 'hl-' + state.activeTool.vocab;
    const alreadyThisColor = el.classList.contains(cls);
    ['hl-blue','hl-green','hl-yellow','hl-pink','flagged'].forEach(c => el.classList.remove(c));
    
    if (!alreadyThisColor) {
      el.classList.add(cls);
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
      state.wordTaps.push({ el, word, def, isStop, key });
    } else {
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
    }
  } else {
    const isColored = ['hl-blue','hl-green','hl-yellow','hl-pink'].some(c=>el.classList.contains(c));
    if (isColored) {
      ['hl-blue','hl-green','hl-yellow','hl-pink'].forEach(c => el.classList.remove(c));
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
    } else if (el.classList.contains('flagged')) {
      el.classList.remove('flagged');
      state.wordTaps = state.wordTaps.filter(w => w.el !== el);
    } else {
      el.classList.add('flagged');
      state.wordTaps.push({ el, word, def, isStop, key });
    }
  }
  updateNavShell();
}

function tapVerseTile(e, v){
  e.stopPropagation();
  state.charVerse = v;
  document.querySelectorAll('.verse-tile').forEach(t=>t.classList.toggle('selected', Number(t.dataset.v)===v));
  updateNavShell();

function checkPassageScroll(){

function renderVocabReview(){
  const box = document.getElementById('vocabReviewBox');
  if (state.wordTaps.length === 0) {
    box.innerHTML = `<div class="glossary-panel"><div class="review-def-entry" style="border:none; opacity:0.7;">No words highlighted yet!</div></div>`;
    return;
  }
  
  const defined = [];
  const undefinedWords = [];
  const seen = new Set();

  state.wordTaps.forEach(w => {
    const norm = normWord(w.word);
    if (seen.has(norm)) return;
    seen.add(norm);

    const fullDef = defs[w.key] || defs[norm];
    if (fullDef) {
      defined.push({ word: w.word, def: fullDef });
    } else {
      undefinedWords.push(w.word);
    }
  });

  let html = '<div class="glossary-panel">';
  if (defined.length > 0) {
    html += `<div class="review-section-header"><i class="fa-solid fa-book-bookmark"></i> Defined Terms</div>`;
    html += defined.map((w,i) => `<div class="review-def-entry"><span class="term-word"><span class="gloss-num">${i+1}</span>${w.word}</span>${w.def}</div>`).join('');
  }
  if (undefinedWords.length > 0) {
    html += `<div class="review-section-header"><i class="fa-solid fa-magnifying-glass"></i> Terms to Define</div>
             <div class="pill-cloud">${undefinedWords.map(word => `<div class="research-pill">${word}</div>`).join('')}</div>`;
  }
  html += '</div>';
  box.innerHTML = html;
}

/* 2 MINUTE TIMER LOGIC */
let timerSeconds = 120;
let timerInterval = null;
let timerRunning = false;

function toggleTimer(){
  const card = document.getElementById('timerCard');
  const btn = document.getElementById('timerBtn');
  const digits = document.getElementById('timerDigits');
  
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    card.classList.remove('running');
    btn.innerHTML = '<i class="fa-solid fa-play"></i> Resume';
  } else {
    if (timerSeconds <= 0) timerSeconds = 120;
    timerRunning = true;
    card.classList.add('running');
    btn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
    
    timerInterval = setInterval(() => {
      timerSeconds--;
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      digits.textContent = `${mins}:${secs}`;
      
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        card.classList.remove('running');
        btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Restart';
      }
    }, 1000);
  }
}

function isModalOpen(){
  const notesOverlay = document.getElementById('devNotesOverlay');
  const paletteOverlay = document.getElementById('devPaletteOverlay');
  return (notesOverlay && notesOverlay.style.display !== 'none') || 
         (paletteOverlay && paletteOverlay.style.display !== 'none');
}

function handleForwardAttempt(){
  if (isModalOpen()) return;
  const b = beats[state.index];
  if (b.blockTap) {
    if ((b.id === 'quest-testament' || b.id === 'quest-section') && !answeredBeats.has(state.index)) { 
      triggerGateShake('Pick an answer to continue', 'shellNextBtn', 'fa-solid fa-hand-point-up'); 
      return; 
    }
    if (b.id === 'vocab-scan') {
      if (!state.wordTaps.length && !state.scrolledToEnd) {
        triggerGateShake('Highlight at least 1 word & scroll down!', 'vocabActionPill');
        return;
      } else if (!state.wordTaps.length) {
        triggerGateShake('Highlight at least 1 word!', 'vocabActionPill');
        return;
      } else if (!state.scrolledToEnd) {
        triggerGateShake('Scroll to the bottom first!', 'vocabActionPill');
        return;
      }
    }
    if (b.id === 'char-verse-pick' && state.charVerse === null) { 
      triggerGateShake('Tap a verse to select!', 'verseActionPill'); 
      return; 
    }
    if (b.id === 'char-coaching' && !(state.trait && state.trait.trim())) { 
      triggerGateShake('Fill in the blank to continue!'); 
      return; 
    }
  }
  goNext();
}

function fitCharVerseText(){
  const vt = document.getElementById('charText');
  const card = vt ? vt.closest('.dark-scripture-card') : null;
  const beatEl = card ? card.closest('.beat') : null;
  if (!vt || !card || !beatEl) return;
  vt.style.fontSize = '';
  const maxFont = parseFloat(getComputedStyle(vt).fontSize);
  let fontSize = maxFont;
  const minFont = Math.max(11, maxFont * 0.5);
  let guard = 0;
  while (beatEl.scrollHeight > beatEl.clientHeight + 2 && fontSize > minFont && guard < 50) {
    fontSize -= 0.5;
    vt.style.fontSize = fontSize + 'px';
    guard++;
  }
}

const PAGE_FLIP_BEAT_IDS = ['reading-intro', 'character-prompt'];
function goNext(){
  if (isModalOpen()) return;
  if (state.index < beats.length - 1) {
    const leavingBeat = beats[state.index];
    if (PAGE_FLIP_BEAT_IDS.includes(leavingBeat.id)) {
      const el = document.getElementById('beat-' + state.index);
      if (el) {
        el.classList.add('page-flip-exit');
        setTimeout(() => {
          el.classList.remove('page-flip-exit');
          state.index++; renderBeat(state.index);
        }, 380);
        return;
      }
    }
    state.index++; renderBeat(state.index);
  }
}

function goPrev(){ 
  if (isModalOpen()) return;
  if (state.index > 0) { 
    state.index--; renderBeat(state.index); 
  } 
}

document.addEventListener('keydown', (e) => {
  const target = e.target;
  const isInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable || target.closest('input, textarea, [contenteditable="true"]'));
  
  if (isInput) return;
  if (isModalOpen()) return;

  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp') {
    const scrollable = document.querySelector(
      '.beat.active .passage-scroll, .beat.active .verse-pick-list, .beat.active .review-scroll'
    );
    if (scrollable) {
      const amount = (e.key === 'PageDown' || e.key === 'PageUp')
        ? scrollable.clientHeight * 0.9
        : 220;
      const dir = (e.key === 'ArrowDown' || e.key === 'PageDown') ? 1 : -1;
      scrollable.scrollBy({ top: amount * dir, behavior: 'smooth' });
      return;
    }
  }
  if (e.key === 'ArrowRight') handleForwardAttempt();
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key.toLowerCase() === 'f') toggleFullScreen();
});

(function initGestureNav(){
  const stageEl = document.getElementById('stage');
  if (!stageEl) return;
  const LEFT_ZONE = 0.28;
  const SWIPE_THRESHOLD = 60;
  let lastSwipeTime = 0;

  stageEl.addEventListener('click', (e) => {
    if (isModalOpen()) return;
    if (Date.now() - lastSwipeTime < 500) return;
    const b = beats[state.index];
    const rect = stageEl.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    if (relX < LEFT_ZONE) {
      goPrev();
    } else if (!b.blockTap) {
      goNext();
    }
  });

  let touchStartX = 0, touchStartY = 0, touchTracking = false;
  stageEl.addEventListener('touchstart', (e) => {
    if (isModalOpen()) return;
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchTracking = true;
  }, { passive: true });

  stageEl.addEventListener('touchend', (e) => {
    if (!touchTracking || isModalOpen()) return;
    touchTracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESHOLD) {
      lastSwipeTime = Date.now();
      const b = beats[state.index];
      if (dx < 0) {
        if (!b.blockTap) goNext();
      } else {
        goPrev();
      }
    }
  }, { passive: true });

  stageEl.addEventListener('touchcancel', () => { touchTracking = false; }, { passive: true });
})();

const passageScrollElInit = document.getElementById('passageScrollEl');
if (passageScrollElInit) passageScrollElInit.addEventListener('scroll', checkPassageScroll, { passive: true });

let devMode = false;
let devTapCount = 0;
let devLastTapTime = 0;
const DEV_NOTES_KEY = 'msHangDevNotes_1_21_45';

function loadDevNotes(){
  try { return JSON.parse(localStorage.getItem(DEV_NOTES_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveDevNotes(obj){
  try { localStorage.setItem(DEV_NOTES_KEY, JSON.stringify(obj)); } catch(e){}
}

function handleEmojiTap(){
  const now = Date.now();
  if (now - devLastTapTime > 1500) devTapCount = 0;
  devTapCount++;
  devLastTapTime = now;
  if (devTapCount >= 10) {
    devTapCount = 0;
    enterDevMode();
  }
}

function enterDevMode(){
  devMode = true;
  document.getElementById('normalProgressWrap').style.display = 'none';
  document.getElementById('devBubblesBar').style.display = 'flex';
  updateHeaderMeta();
  renderDevBubbles();
}

function exitDevMode(){
  devMode = false;
  document.getElementById('normalProgressWrap').style.display = 'block';
  document.getElementById('devBubblesBar').style.display = 'none';
  updateHeaderMeta();
  closeDevNotesPanel();
  closePaletteModal();
}

function renderDevBubbles(){
  const bar = document.getElementById('devBubblesBar');
  const notes = loadDevNotes();
  bar.innerHTML = '';
  beats.forEach((b, i) => {
    const bub = document.createElement('div');
    bub.className = 'dev-bubble' + (i === state.index ? ' active' : '');
    bub.style.background = b.bgGrad;
    bub.style.color = b.text === 'light' ? '#FFF' : 'var(--ink)';
    bub.textContent = i + 1;
    bub.title = b.id;
    if (notes[i + '_' + b.id] && notes[i + '_' + b.id].trim()) {
      const dot = document.createElement('div');
      dot.className = 'note-dot';
      bub.appendChild(dot);
    }
    bub.onclick = (e) => { e.stopPropagation(); state.index = i; renderBeat(i); renderDevBubbles(); };
    bar.appendChild(bub);
  });
  const activeBub = bar.querySelector('.dev-bubble.active');
  if (activeBub) activeBub.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function openDevNotesPanel(){
  const b = beats[state.index];
  document.getElementById('dnpTitle').textContent = `Slide ${state.index + 1}: ${b.id}`;
  const notes = loadDevNotes();
  document.getElementById('devNoteInput').value = notes[state.index + '_' + b.id] || '';
  document.getElementById('devAllNotesSection').style.display = 'none';
  document.getElementById('dnpStatus').textContent = '';
  document.getElementById('dnpRetryBtn').style.display = 'none';
  document.getElementById('devNotesOverlay').style.display = 'flex';
}
function closeDevNotesPanel(){
  document.getElementById('devNotesOverlay').style.display = 'none';
}
function saveCurrentDevNote(val){
  const b = beats[state.index];
  const notes = loadDevNotes();
  notes[state.index + '_' + b.id] = val;
  saveDevNotes(notes);
  if (devMode) renderDevBubbles();
}

function clearCurrentDevNote(){
  const b = beats[state.index];
  const notes = loadDevNotes();
  delete notes[state.index + '_' + b.id];
  saveDevNotes(notes);
  const input = document.getElementById('devNoteInput');
  if (input) input.value = '';
  if (devMode) renderDevBubbles();
}

function clearAllDevNotes(){
  if (!confirm('Clear all slide notes? This cannot be undone.')) return;
  saveDevNotes({});
  const input = document.getElementById('devNoteInput');
  if (input) input.value = '';
  const allNotesPanel = document.getElementById('devAllNotesPanel');
  if (allNotesPanel) allNotesPanel.value = '';
  if (devMode) renderDevBubbles();
}

function compileAllNotes(){
  const notes = loadDevNotes();
  const lines = [];
  beats.forEach((b, i) => {
    const key = i + '_' + b.id;
    const txt = notes[key];
    if (txt && txt.trim()) lines.push(`[${i}] ${b.id}:\n${txt.trim()}`);
  });
  return lines.length ? lines.join('\n\n') : 'No notes yet.';
}

function copyAllDevNotes(){
  const section = document.getElementById('devAllNotesSection');
  const panel = document.getElementById('devAllNotesPanel');
  section.style.display = 'flex';
  panel.value = compileAllNotes();
  panel.focus();
  panel.select();
  tryCopyAllNotes();
}

function tryCopyAllNotes(){
  const panel = document.getElementById('devAllNotesPanel');
  const status = document.getElementById('dnpStatus');
  const retryBtn = document.getElementById('dnpRetryBtn');
  panel.focus();
  panel.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(panel.value).then(() => {
      status.textContent = '✓ Copied to clipboard';
      status.className = 'dnp-status ok';
      retryBtn.style.display = 'none';
    }).catch(() => {
      status.textContent = 'Copy failed — select the text above and copy manually.';
      status.className = 'dnp-status warn';
      retryBtn.style.display = 'inline-block';
    });
  } else {
    status.textContent = 'Clipboard unavailable — select the text above and copy manually.';
    status.className = 'dnp-status warn';
    retryBtn.style.display = 'inline-block';
  }
}

initNotches();
renderBeat(0);
</script>
</body>
</html>
